<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SMART GRADE - Achievements</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Cinzel:wght@400;700&family=Quicksand:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Fredoka:wght@400;600;700&family=Pacifico&family=Bangers&family=Lobster&family=Permanent+Marker&family=Comfortaa:wght@300;400;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/night-mode.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f3b48">
  <style>
    .progress-section {
      text-align: center;
      padding: 20px;
      background: var(--card-bg);
      border-radius: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .big-progress {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
    }
    .progress-bar {
      background: rgba(0,0,0,0.08);
      border-radius: 30px;
      height: 12px;
      overflow: hidden;
      margin: 12px 0;
    }
    .progress-fill {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      height: 100%;
      border-radius: 30px;
      width: 0%;
      transition: width 0.5s ease;
    }
    
    /* Cartes des badges */
    .badges-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    
    .badge-card {
      display: flex;
      gap: 14px;
      padding: 16px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }
    
    .badge-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    
    .badge-card.locked {
      opacity: 0.6;
      filter: grayscale(0.3);
    }
    
    .badge-card.unlocked {
      border-left: 4px solid #2ecc71;
    }
    
    .badge-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
      color: white;
    }
    
    .badge-icon.unlocked {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
    }
    
    .badge-icon.locked {
      background: #95a5a6;
    }
    
    .badge-info {
      flex: 1;
    }
    
    .badge-name {
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }
    
    .badge-desc {
      font-size: 0.65rem;
      color: var(--text-light);
      margin-bottom: 6px;
    }
    
    .badge-status {
      font-size: 0.6rem;
      margin-top: 4px;
    }
    
    .badge-status.unlocked {
      color: #2ecc71;
    }
    
    .badge-status.locked {
      color: #95a5a6;
    }
    
    .badge-progress {
      margin-top: 8px;
      height: 4px;
      background: rgba(0,0,0,0.08);
      border-radius: 4px;
      overflow: hidden;
    }
    
    .badge-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      width: 0%;
      border-radius: 4px;
    }
    
    .streak-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      background: var(--card-bg);
      border-radius: 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }
    
    .streak-card.locked {
      opacity: 0.6;
    }
    
    .streak-card.unlocked {
      border-left: 4px solid #f39c12;
    }
    
    .streak-icon {
      width: 45px;
      height: 45px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }
    
    .streak-info {
      flex: 1;
    }
    
    .streak-name {
      font-weight: 700;
      font-size: 0.85rem;
    }
    
    .streak-desc {
      font-size: 0.65rem;
      color: var(--text-light);
      margin-top: 2px;
    }
    
    .streak-progress {
      font-size: 0.6rem;
      font-weight: 600;
      min-width: 70px;
      text-align: right;
    }
    
    .section-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 16px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
    }
    
    @media (max-width: 550px) {
      .badges-grid {
        grid-template-columns: 1fr;
      }
      .streak-card {
        flex-direction: column;
        text-align: center;
      }
      .streak-progress {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="app-container">
    <div class="mobile-header">
      <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
      <div class="header-logo"><i class="fas fa-medal"></i><span>ACHIEVEMENTS</span></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <a href="profile.html"><div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;color:white;font-size:0.8rem;" id="headerAvatar"><i class="fas fa-user-graduate"></i></div></a>
        <div class="theme-btn-header" id="themeBtn"><i class="fas fa-palette"></i><span>Theme</span></div>
      </div>
    </div>
    
    <div class="sheet-overlay" id="sheetOverlay"></div>
    <div class="bottom-sheet" id="bottomSheet">
      <div class="bottom-sheet-header"><h3><i class="fas fa-brush"></i> Theme</h3><button class="close-sheet" id="closeSheet"><i class="fas fa-times"></i></button></div>
      <div class="bottom-sheet-content">
        <div class="theme-grid-rect" id="themeGrid"></div>
        <div class="font-row-sheet"><div class="font-sheet" data-font="small">A<sup>-</sup></div><div class="font-sheet" data-font="medium">A</div><div class="font-sheet" data-font="large">A<sup>+</sup></div></div>
      </div>
    </div>
    
    <div class="sidebar-menu" id="sidebarMenu">
      <div class="sidebar-header"><h3><i class="fas fa-graduation-cap"></i> MENU</h3><button class="close-sidebar" id="closeSidebar"><i class="fas fa-times"></i></button></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><i class="fas fa-chalkboard-user"></i> Dashboard</a>
        <a href="achievements.html" class="nav-item active"><i class="fas fa-medal"></i> Achievements</a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i> Profile</a>
        <a href="settings.html" class="nav-item"><i class="fas fa-sliders-h"></i> Settings</a>
        <a href="#" class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </div>
    <div class="overlay" id="overlay"></div>
    
    <main class="main-content">
      
      <div class="glass-card text-center" style="background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;">
        <i class="fas fa-trophy" style="font-size:40px;opacity:0.5;"></i>
        <h2 style="color:white;margin:8px 0;">Achievements</h2>
        <p style="opacity:0.8;font-size:0.7rem;">Unlock badges by using SMART GRADE</p>
      </div>
      
      <div class="progress-section">
        <i class="fas fa-chart-line" style="font-size:24px;color:var(--primary);"></i>
        <div class="big-progress" id="progressPercent">0%</div>
        <div style="font-size:0.7rem;color:var(--text-light);">
          <span id="unlockedCount">0</span> / <span id="totalCount">0</span> Badges Unlocked
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width:0%;"></div>
        </div>
        <div style="margin-top:8px;font-size:0.6rem;color:var(--text-light);">
          <i class="fas fa-fire"></i> Current Streak: <strong id="streakDays">0</strong> days
        </div>
      </div>
      
      <!-- STREAK BADGES -->
      <div class="glass-card">
        <div class="section-title">
          <i class="fas fa-fire" style="color:#f39c12;"></i> Streak Badges
        </div>
        <div id="streakList"></div>
      </div>
      
      <!-- ACHIEVEMENT BADGES -->
      <div class="glass-card">
        <div class="section-title">
          <i class="fas fa-medal" style="color:var(--primary);"></i> Achievement Badges
        </div>
        <div id="achievementsList" class="badges-grid"></div>
      </div>
      
    </main>
  </div>
  
  <div id="toastContainer" class="toast-container"></div>
  
  <script src="js/utils.js"></script>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    // ============================================
    // ACHIEVEMENTS SYSTEM - TOUS LES BADGES
    // ============================================
    
    var currentUser = null;
    
    // Liste COMPLÈTE des badges (débloqués ET verrouillés)
    var ALL_BADGES = [
      // Streak badges
      { id: 's1', type: 'streak', name: 'Beginner Streak', desc: 'Use the app for 3 days', daysRequired: 3, icon: 'fa-seedling', color: '#2ecc71' },
      { id: 's2', type: 'streak', name: 'Regular Streak', desc: 'Use the app for 7 days', daysRequired: 7, icon: 'fa-leaf', color: '#27ae60' },
      { id: 's3', type: 'streak', name: 'Dedicated Streak', desc: 'Use the app for 15 days', daysRequired: 15, icon: 'fa-tree', color: '#1e8449' },
      { id: 's4', type: 'streak', name: 'Legendary Streak', desc: 'Use the app for 30 days', daysRequired: 30, icon: 'fa-crown', color: '#f39c12' },
      
      // Achievement badges
      { id: 38, type: 'achievement', name: 'Welcome Aboard', desc: 'First login after installation', icon: 'fa-door-open', color: '#3498db' },
      { id: 36, type: 'achievement', name: 'Photo Uploader', desc: 'Add a profile photo', icon: 'fa-camera', color: '#9b59b6' },
      { id: 1, type: 'achievement', name: 'First Grade', desc: 'Add your very first grade', icon: 'fa-pen', color: '#e74c3c' },
      { id: 2, type: 'achievement', name: 'Perfect Score', desc: 'Get 20/20 in any subject', icon: 'fa-star', color: '#f1c40f' },
      { id: 3, type: 'achievement', name: 'High Average', desc: 'Overall average 12/20 and above', icon: 'fa-arrow-up', color: '#2ecc71' },
      { id: 4, type: 'achievement', name: 'Bookworm', desc: 'Record 10+ grades', icon: 'fa-book-open', color: '#e67e22' },
      { id: 5, type: 'achievement', name: 'Dedication', desc: 'Record 30+ grades', icon: 'fa-fire', color: '#e74c3c' },
      { id: 6, type: 'achievement', name: 'Scholar', desc: 'Unlock 8 achievements', icon: 'fa-graduation-cap', color: '#8e44ad' },
      { id: 7, type: 'achievement', name: 'Rising Star', desc: 'Improve by 1+ point in a term', icon: 'fa-rocket', color: '#3498db' },
      { id: 8, type: 'achievement', name: 'Unstoppable', desc: 'All 3 terms have grades entered', icon: 'fa-bolt', color: '#f39c12' },
      { id: 9, type: 'achievement', name: 'Subject Completion', desc: 'Add grades in all subjects', icon: 'fa-check-double', color: '#27ae60' },
      { id: 10, type: 'achievement', name: 'Active Semester', desc: 'Complete a full term', icon: 'fa-calendar-check', color: '#1abc9c' },
      { id: 11, type: 'achievement', name: 'Discipline Mastery', desc: 'Average above 15 in one subject', icon: 'fa-crown', color: '#f1c40f' },
      { id: 12, type: 'achievement', name: 'Study Progress', desc: 'Record 25+ grades', icon: 'fa-chart-bar', color: '#3498db' },
      { id: 13, type: 'achievement', name: 'Full Achievement', desc: 'Unlock ALL badges', icon: 'fa-trophy', color: '#f39c12' },
      { id: 14, type: 'achievement', name: 'Excellent Result', desc: 'Get 20/20 in a subject', icon: 'fa-medal', color: '#e74c3c' },
      { id: 25, type: 'achievement', name: 'Comeback King', desc: 'Go from <10 to >14 in a subject', icon: 'fa-arrow-trend-up', color: '#2ecc71' },
      { id: 34, type: 'achievement', name: 'Theme Collector', desc: 'Try 10 different themes', icon: 'fa-palette', color: '#9b59b6' },
      { id: 50, type: 'achievement', name: 'Font Collector', desc: 'Try 6 different fonts', icon: 'fa-font', color: '#3498db' },
      { id: 57, type: 'achievement', name: 'Timetable Viewer', desc: 'View timetable 10 times', icon: 'fa-calendar-alt', color: '#e67e22' },
      { id: 58, type: 'achievement', name: 'Flashcard Beginner', desc: 'Create 5 custom flashcards', icon: 'fa-clone', color: '#1abc9c' },
      { id: 59, type: 'achievement', name: 'Flashcard Master', desc: 'Create 10 custom flashcards', icon: 'fa-layer-group', color: '#e74c3c' }
    ];
    
    // Fonction pour récupérer les badges débloqués
    function getUnlockedBadges() {
      var achievements = JSON.parse(localStorage.getItem('smartgrade_achievements_' + (currentUser ? currentUser.id : '')) || '[]');
      var unlockedIds = achievements.filter(function(a) { return a.unlocked; }).map(function(a) { return a.id; });
      return unlockedIds;
    }
    
    // Vérifier si un badge est débloqué
    function isBadgeUnlocked(badgeId) {
      var unlocked = getUnlockedBadges();
      return unlocked.indexOf(badgeId) !== -1;
    }
    
    // Récupérer la date de déblocage
    function getUnlockDate(badgeId) {
      var achievements = JSON.parse(localStorage.getItem('smartgrade_achievements_' + (currentUser ? currentUser.id : '')) || '[]');
      var achievement = achievements.find(function(a) { return a.id === badgeId; });
      return achievement && achievement.unlockDate ? achievement.unlockDate : null;
    }
    
    // Afficher les streak badges
    function displayStreakBadges(streakDays) {
      var streakBadges = ALL_BADGES.filter(function(b) { return b.type === 'streak'; });
      var container = document.getElementById('streakList');
      
      var html = '';
      streakBadges.forEach(function(badge) {
        var isUnlocked = streakDays >= badge.daysRequired;
        var progress = Math.min(100, Math.round((streakDays / badge.daysRequired) * 100));
        
        html += `
          <div class="streak-card ${isUnlocked ? 'unlocked' : 'locked'}">
            <div class="streak-icon" style="background: ${isUnlocked ? badge.color : '#95a5a6'}; color: white;">
              <i class="fas ${badge.icon}"></i>
            </div>
            <div class="streak-info">
              <div class="streak-name">${badge.name}</div>
              <div class="streak-desc">${badge.desc}</div>
              ${!isUnlocked ? `<div class="badge-progress"><div class="badge-progress-fill" style="width: ${progress}%;"></div></div>` : ''}
            </div>
            <div class="streak-progress">
              ${isUnlocked ? '<span style="color:#2ecc71;"><i class="fas fa-check-circle"></i> Unlocked</span>' : `${streakDays}/${badge.daysRequired} days`}
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }
    
    // Afficher TOUS les achievement badges (débloqués ET verrouillés)
    function displayAchievementBadges() {
      var achievementBadges = ALL_BADGES.filter(function(b) { return b.type === 'achievement'; });
      var container = document.getElementById('achievementsList');
      var unlockedCount = 0;
      
      var html = '';
      achievementBadges.forEach(function(badge) {
        var isUnlocked = isBadgeUnlocked(badge.id);
        var unlockDate = getUnlockDate(badge.id);
        if (isUnlocked) unlockedCount++;
        
        var statusHtml = '';
        if (isUnlocked) {
          statusHtml = '<div class="badge-status unlocked"><i class="fas fa-check-circle"></i> Unlocked: ' + (unlockDate || 'Recently') + '</div>';
        } else {
          statusHtml = '<div class="badge-status locked"><i class="fas fa-lock"></i> Locked - Keep using the app!</div>';
        }
        
        html += `
          <div class="badge-card ${isUnlocked ? 'unlocked' : 'locked'}">
            <div class="badge-icon ${isUnlocked ? 'unlocked' : 'locked'}" style="background: ${isUnlocked ? badge.color : '#95a5a6'};">
              <i class="fas ${badge.icon}"></i>
            </div>
            <div class="badge-info">
              <div class="badge-name">${badge.name}</div>
              <div class="badge-desc">${badge.desc}</div>
              ${statusHtml}
            </div>
          </div>
        `;
      });
      
      container.innerHTML = html;
      
      // Mettre à jour les statistiques
      var totalBadges = achievementBadges.length;
      document.getElementById('unlockedCount').innerHTML = unlockedCount;
      document.getElementById('totalCount').innerHTML = totalBadges;
      var percent = totalBadges > 0 ? Math.round((unlockedCount / totalBadges) * 100) : 0;
      document.getElementById('progressPercent').innerHTML = percent + '%';
      document.getElementById('progressFill').style.width = percent + '%';
    }
    
    // Charger les achievements
    function loadAchievements() {
      currentUser = getCurrentStudent();
      if (!currentUser) {
        window.location.href = 'login.html';
        return;
      }
      
      var streak = getStudentStreak(currentUser.id);
      var streakDays = streak ? streak.days : 0;
      document.getElementById('streakDays').innerHTML = streakDays;
      
      displayStreakBadges(streakDays);
      displayAchievementBadges();
      updateHeaderProfile();
    }
    
    function updateHeaderProfile() {
      var headerAvatar = document.getElementById('headerAvatar');
      if (!headerAvatar) return;
      try {
        var profile = JSON.parse(localStorage.getItem('smartgrade_profile_' + currentUser.id) || '{}');
        if (profile.avatarBase64) {
          headerAvatar.innerHTML = '<img src="' + profile.avatarBase64 + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
        }
      } catch(e) {}
    }
    
    // Initialisation
    loadAchievements();
    initMobileMenu();
    initThemeSelector();
  </script>
</body>
</html>
