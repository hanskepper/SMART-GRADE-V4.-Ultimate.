<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SMART GRADE - Add Grade</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Cinzel:wght@400;700&family=Quicksand:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Fredoka:wght@400;600;700&family=Pacifico&family=Bangers&family=Lobster&family=Permanent+Marker&family=Comfortaa:wght@300;400;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/night-mode.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f3b48">
  <style>
    .grade-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.7rem;
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
    }
    .grade-table th {
      background: var(--primary);
      color: white;
      padding: 12px 8px;
      text-align: center;
      font-weight: 700;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .grade-table td {
      padding: 10px 8px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .grade-table .subject-name {
      text-align: left;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .grade-table .subject-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.7rem;
    }
    .grade-table input {
      width: 70px;
      padding: 8px;
      border-radius: 8px;
      border: 2px solid var(--border);
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--card-bg);
      color: var(--text);
      transition: all 0.2s;
    }
    .grade-table input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15,59,72,0.1);
    }
    .grade-table .avg-col {
      font-weight: 800;
      color: var(--primary);
      font-size: 0.85rem;
    }
    .term-tabs-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .term-tab-btn {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.7rem;
      background: rgba(0,0,0,0.03);
      border: 1px solid var(--border);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .term-tab-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border-color: transparent;
    }
    .coeff-col {
      font-weight: 700;
      width: 55px;
    }
    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    @media (max-width: 600px) {
      .grade-table input {
        width: 55px;
        padding: 6px;
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="app-container">
    <div class="mobile-header">
      <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
      <div class="header-logo"><i class="fas fa-pen-fancy"></i><span>ADD GRADE</span></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <a href="profile.html">
          <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;color:white;font-size:0.8rem;" id="headerAvatar">
            <i class="fas fa-user-graduate"></i>
          </div>
        </a>
        <div class="theme-btn-header" id="themeBtn"><i class="fas fa-palette"></i><span>Theme</span></div>
      </div>
    </div>
    
    <div class="sheet-overlay" id="sheetOverlay"></div>
    <div class="bottom-sheet" id="bottomSheet">
      <div class="bottom-sheet-header"><h3><i class="fas fa-brush"></i> Theme</h3><button class="close-sheet" id="closeSheet"><i class="fas fa-times"></i></button></div>
      <div class="bottom-sheet-content">
        <div class="theme-grid-rect" id="themeGrid"></div>
        <div class="font-row-sheet">
          <div class="font-sheet" data-font="small">A<sup>-</sup></div>
          <div class="font-sheet" data-font="medium">A</div>
          <div class="font-sheet" data-font="large">A<sup>+</sup></div>
        </div>
      </div>
    </div>
    
    <div class="sidebar-menu" id="sidebarMenu">
      <div class="sidebar-header"><h3><i class="fas fa-graduation-cap"></i> MENU</h3><button class="close-sidebar" id="closeSidebar"><i class="fas fa-times"></i></button></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><i class="fas fa-chalkboard-user"></i> Dashboard</a>
        <a href="add-grade.html" class="nav-item active"><i class="fas fa-pen-fancy"></i> Add Grade</a>
        <a href="term1.html" class="nav-item"><i class="fas fa-1"></i> Term 1</a>
        <a href="term2.html" class="nav-item"><i class="fas fa-2"></i> Term 2</a>
        <a href="term3.html" class="nav-item"><i class="fas fa-3"></i> Term 3</a>
        <a href="settings.html" class="nav-item"><i class="fas fa-sliders-h"></i> Settings</a>
        <a href="#" class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </div>
    <div class="overlay" id="overlay"></div>
    
    <main class="main-content">
      
      <div class="term-tabs-row" id="termTabs">
        <div class="term-tab-btn active" data-term="1"><i class="fas fa-1"></i> Term 1</div>
        <div class="term-tab-btn" data-term="2"><i class="fas fa-2"></i> Term 2</div>
        <div class="term-tab-btn" data-term="3"><i class="fas fa-3"></i> Term 3</div>
      </div>
      
      <div class="glass-card" style="overflow-x:auto;padding:0;">
        <table class="grade-table" id="gradeTable">
          <thead id="tableHeader"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      
      <div class="action-buttons">
        <button class="btn btn-primary" onclick="saveAllGrades()"><i class="fas fa-save"></i> Save All Grades</button>
      </div>
      
    </main>
  </div>
  
  <div id="toastContainer" class="toast-container"></div>
  
  <script src="js/utils.js"></script>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    var currentUser = null;
    var currentTerm = 1;
    var subjectColors = ['#3498db','#e74c3c','#9b59b6','#2ecc71','#e67e22','#00bcd4','#f39c12','#1abc9c','#27ae60','#2980b9','#c0392b','#8e44ad','#16a085','#d35400'];
    
    function loadAddGrade() {
      currentUser = requireAuth();
      if (!currentUser) return;
      
      var subjects = getActiveSubjectsWithCoefficients(currentUser.id, currentTerm);
      var grades = getStudentGrades(currentUser.id);
      var seq1 = (currentTerm - 1) * 2 + 1;
      var seq2 = seq1 + 1;
      
      var headerHtml = '<tr><th style="text-align:left;">SUBJECT</th><th>COEFF</th><th>S' + seq1 + '</th><th>S' + seq2 + '</th><th>AVERAGE</th></tr>';
      document.getElementById('tableHeader').innerHTML = headerHtml;
      
      var bodyHtml = '';
      for (var i = 0; i < subjects.length; i++) {
        var s = subjects[i];
        var g1 = grades.find(function(x) { return x.subjectId === s.id && x.sequenceId === seq1; });
        var g2 = grades.find(function(x) { return x.subjectId === s.id && x.sequenceId === seq2; });
        var v1 = g1 ? g1.value : '';
        var v2 = g2 ? g2.value : '';
        var avg = (v1 !== '' && v2 !== '') ? formatNumber((parseFloat(v1) + parseFloat(v2)) / 2) : '--';
        
        bodyHtml += '<tr>' +
          '<td class="subject-name">' +
            '<div class="subject-icon" style="background:' + (subjectColors[i % subjectColors.length] || '#3498db') + ';">' +
              '<i class="fas ' + s.icon + '"></i>' +
            '</div>' +
            '<span>' + s.name + '</span>' +
          '</td>' +
          '<td class="coeff-col">' + s.coefficient + '</td>' +
          '<td><input type="number" step="0.01" min="0" max="20" class="grade-input" data-subj="' + s.id + '" data-seq="' + seq1 + '" value="' + (v1 !== '' ? v1 : '') + '"></td>' +
          '<td><input type="number" step="0.01" min="0" max="20" class="grade-input" data-subj="' + s.id + '" data-seq="' + seq2 + '" value="' + (v2 !== '' ? v2 : '') + '"></td>' +
          '<td class="avg-col" id="avg-' + s.id + '">' + avg + '</td>' +
        '</tr>';
      }
      document.getElementById('tableBody').innerHTML = bodyHtml;
      
      document.querySelectorAll('.grade-input').forEach(function(input) {
        input.addEventListener('input', function() {
          updateAverageForSubject(parseInt(this.dataset.subj));
        });
      });
      
      initHeaderProfile();
    }
    
    function updateAverageForSubject(subjectId) {
      var seq1 = (currentTerm - 1) * 2 + 1;
      var seq2 = seq1 + 1;
      
      var input1 = document.querySelector('.grade-input[data-subj="' + subjectId + '"][data-seq="' + seq1 + '"]');
      var input2 = document.querySelector('.grade-input[data-subj="' + subjectId + '"][data-seq="' + seq2 + '"]');
      var avgCell = document.getElementById('avg-' + subjectId);
      
      var val1 = input1 ? parseFloat(input1.value) : NaN;
      var val2 = input2 ? parseFloat(input2.value) : NaN;
      
      var avg = '--';
      if (!isNaN(val1) && !isNaN(val2) && val1 !== '' && val2 !== '') {
        avg = ((val1 + val2) / 2).toFixed(2);
      } else if (!isNaN(val1) && val1 !== '') {
        avg = val1.toFixed(2);
      } else if (!isNaN(val2) && val2 !== '') {
        avg = val2.toFixed(2);
      }
      
      if (avgCell) avgCell.innerHTML = avg;
    }
    
    function saveAllGrades() {
      var grades = getStudentGrades(currentUser.id);
      var inputs = document.querySelectorAll('.grade-input');
      var changed = false;
      var savedCount = 0;
      var newGrades = [];
      
      inputs.forEach(function(input) {
        var subjectId = parseInt(input.dataset.subj);
        var sequenceId = parseInt(input.dataset.seq);
        var value = parseFloat(input.value);
        
        if (!isNaN(value) && value >= 0 && value <= 20) {
          var roundedValue = Math.round(value * 100) / 100;
          var existingIndex = grades.findIndex(function(g) {
            return g.subjectId === subjectId && g.sequenceId === sequenceId;
          });
          
          if (existingIndex !== -1) {
            if (grades[existingIndex].value !== roundedValue) {
              grades[existingIndex].value = roundedValue;
              changed = true;
              savedCount++;
            }
          } else {
            var newId = grades.length > 0 ? Math.max.apply(null, grades.map(function(g) { return g.id; })) + 1 : 1;
            grades.push({
              id: newId,
              subjectId: subjectId,
              sequenceId: sequenceId,
              value: roundedValue,
              date: new Date().toISOString().split('T')[0]
            });
            changed = true;
            savedCount++;
          }
        }
      });
      
      if (changed) {
        saveStudentGrades(currentUser.id, grades);
        addHistory(currentUser.id, 'Grades updated for Term ' + currentTerm);
        playActionFeedback();
        showToast('Grades saved successfully!');
        
        // ⭐ NOTIFICATION
        if (typeof notifyGradesSaved === 'function') {
          notifyGradesSaved(savedCount);
        }
        
        loadAddGrade();
      } else {
        showToast('No valid grades to save');
      }
    }
    
    document.querySelectorAll('.term-tab-btn').forEach(function(tab, index) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.term-tab-btn').forEach(function(t) {
          t.classList.remove('active');
        });
        tab.classList.add('active');
        currentTerm = index + 1;
        loadAddGrade();
      });
    });
    
    loadAddGrade();
    initMobileMenu();
    initThemeSelector();
  </script>
</body>
</html>
