<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SMART GRADE - Add Grade</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Cinzel:wght@400;700&family=Quicksand:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Fredoka:wght@400;600;700&family=Pacifico&family=Bangers&family=Lobster&family=Permanent+Marker&family=Comfortaa:wght@300;400;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/night-mode.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f3b48">
  <style>
    .grade-table-new {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.7rem;
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
    }
    .grade-table-new th {
      background: var(--primary);
      color: white;
      padding: 12px 6px;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .grade-table-new td {
      padding: 10px 6px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .grade-table-new .subj-col {
      text-align: left;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .grade-table-new .icon-sm {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.7rem;
    }
    .grade-table-new input {
      width: 70px;
      padding: 8px;
      border-radius: 8px;
      border: 2px solid var(--border);
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--card-bg);
      color: var(--text);
      transition: all 0.2s;
    }
    .grade-table-new input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15,59,72,0.1);
    }
    .grade-table-new .avg-col {
      font-weight: 800;
      color: var(--primary);
      font-size: 0.85rem;
    }
    .term-tabs-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .term-tab-btn {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.7rem;
      background: rgba(0,0,0,0.03);
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .term-tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .coeff-col {
      font-weight: 700;
      width: 55px;
    }
    @media (max-width: 600px) {
      .grade-table-new input {
        width: 60px;
        padding: 6px;
        font-size: 0.7rem;
      }
      .grade-table-new th, .grade-table-new td {
        padding: 8px 4px;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="app-container">
    <div class="mobile-header">
      <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
      <div class="header-logo"><i class="fas fa-book-open"></i><span>ADD GRADE</span></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <a href="profile.html">
          <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;color:white;font-size:0.8rem;" id="headerAvatar">
            <i class="fas fa-user-graduate"></i>
          </div>
        </a>
        <div class="theme-btn-header" id="themeBtn"><i class="fas fa-palette"></i><span>Theme</span></div>
      </div>
    </div>
    
    <div class="sheet-overlay" id="sheetOverlay"></div>
    <div class="bottom-sheet" id="bottomSheet">
      <div class="bottom-sheet-header"><h3><i class="fas fa-brush"></i> Theme</h3><button class="close-sheet" id="closeSheet"><i class="fas fa-times"></i></button></div>
      <div class="bottom-sheet-content">
        <div class="theme-grid-rect" id="themeGrid"></div>
        <div class="font-row-sheet">
          <div class="font-sheet" data-font="small">A<sup>-</sup></div>
          <div class="font-sheet" data-font="medium">A</div>
          <div class="font-sheet" data-font="large">A<sup>+</sup></div>
        </div>
      </div>
    </div>
    
    <div class="sidebar-menu" id="sidebarMenu">
      <div class="sidebar-header"><h3><i class="fas fa-graduation-cap"></i> MENU</h3><button class="close-sidebar" id="closeSidebar"><i class="fas fa-times"></i></button></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><i class="fas fa-chalkboard-user"></i> Dashboard</a>
        <a href="add-grade.html" class="nav-item active"><i class="fas fa-pen-fancy"></i> Add Grade</a>
        <a href="term1.html" class="nav-item"><i class="fas fa-1"></i> Term 1</a>
        <a href="term2.html" class="nav-item"><i class="fas fa-2"></i> Term 2</a>
        <a href="term3.html" class="nav-item"><i class="fas fa-3"></i> Term 3</a>
        <a href="settings.html" class="nav-item"><i class="fas fa-sliders-h"></i> Settings</a>
        <a href="#" class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </div>
    <div class="overlay" id="overlay"></div>
    
    <main class="main-content">
      
      <div class="term-tabs-row" id="termTabs">
        <div class="term-tab-btn active" data-term="1">Term 1 (S1+S2)</div>
        <div class="term-tab-btn" data-term="2">Term 2 (S3+S4)</div>
        <div class="term-tab-btn" data-term="3">Term 3 (S5+S6)</div>
      </div>
      
      <div class="glass-card" style="overflow-x:auto;">
        <table class="grade-table-new" id="gradeTable">
          <thead id="tableHeader"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      
      <button class="btn btn-primary mt-1" onclick="saveAll()"><i class="fas fa-save"></i> Save All Grades</button>
      
    </main>
  </div>
  
  <div id="toastContainer" class="toast-container"></div>
  
  <script src="js/utils.js"></script>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    var cu = null;
    var cTerm = 1;
    var sc = ['#3498db','#e74c3c','#9b59b6','#2ecc71','#e67e22','#00bcd4','#f39c12','#1abc9c','#27ae60','#2980b9','#c0392b','#8e44ad','#16a085','#d35400'];
    
    function loadAddGrade() {
      cu = requireAuth();
      if (!cu) return;
      
      var subs = getActiveSubjectsWithCoefficients(cu.id, cTerm);
      var g = getStudentGrades(cu.id);
      var s1 = (cTerm - 1) * 2 + 1;
      var s2 = s1 + 1;
      
      // Header du tableau - CORRIGÉ
      var headerHtml = '<tr>' +
        '<th style="text-align:left;">SUBJECT</th>' +
        '<th>COEFF</th>' +
        '<th>S' + s1 + '</th>' +
        '<th>S' + s2 + '</th>' +
        '<th>AVG</th>' +
        '</tr>';
      document.getElementById('tableHeader').innerHTML = headerHtml;
      
      // Body du tableau - CORRIGÉ
      var bodyHtml = '';
      for (var i = 0; i < subs.length; i++) {
        var s = subs[i];
        var g1 = g.find(function(x) { return x.subjectId === s.id && x.sequenceId === s1; });
        var g2 = g.find(function(x) { return x.subjectId === s.id && x.sequenceId === s2; });
        var v1 = g1 ? g1.value : '';
        var v2 = g2 ? g2.value : '';
        var avg = (v1 !== '' && v2 !== '') ? formatNumber((parseFloat(v1) + parseFloat(v2)) / 2) : '--';
        
        bodyHtml += '<tr>' +
          '<td class="subj-col">' +
            '<span class="icon-sm" style="background:' + (sc[i % sc.length] || '#3498db') + ';">' +
              '<i class="fas ' + s.icon + '"></i>' +
            '</span>' +
            '<span>' + s.name + '</span>' +
          '</td>' +
          '<td class="coeff-col">' + s.coefficient + '</td>' +
          '<td><input type="number" step="0.01" min="0" max="20" class="gi" data-subj="' + s.id + '" data-seq="' + s1 + '" value="' + (v1 !== '' ? v1 : '') + '"></td>' +
          '<td><input type="number" step="0.01" min="0" max="20" class="gi" data-subj="' + s.id + '" data-seq="' + s2 + '" value="' + (v2 !== '' ? v2 : '') + '"></td>' +
          '<td class="avg-col ad" data-subj="' + s.id + '">' + avg + '</td>' +
        '</tr>';
      }
      document.getElementById('tableBody').innerHTML = bodyHtml;
      
      // Ajouter les événements pour mise à jour en temps réel
      document.querySelectorAll('.gi').forEach(function(input) {
        input.addEventListener('input', updateAvg);
      });
      
      initHeaderProfile();
    }
    
    function updateAvg() {
      var s1 = (cTerm - 1) * 2 + 1;
      var s2 = s1 + 1;
      
      document.querySelectorAll('.gi').forEach(function(input) {
        var sj = parseInt(input.dataset.subj);
        var sq = parseInt(input.dataset.seq);
        
        if (sq === s1 || sq === s2) {
          var v1 = document.querySelector('.gi[data-subj="' + sj + '"][data-seq="' + s1 + '"]');
          var v2 = document.querySelector('.gi[data-subj="' + sj + '"][data-seq="' + s2 + '"]');
          var ad = document.querySelector('.ad[data-subj="' + sj + '"]');
          
          if (v1 && v2 && ad) {
            var val1 = v1.value !== '' ? parseFloat(v1.value) : NaN;
            var val2 = v2.value !== '' ? parseFloat(v2.value) : NaN;
            var a = '--';
            
            if (!isNaN(val1) && !isNaN(val2)) {
              a = formatNumber((val1 + val2) / 2);
            } else if (!isNaN(val1)) {
              a = formatNumber(val1);
            } else if (!isNaN(val2)) {
              a = formatNumber(val2);
            }
            ad.innerHTML = a;
          }
        }
      });
    }
    
    function saveAll() {
      var inputs = document.querySelectorAll('.gi');
      var g = getStudentGrades(cu.id);
      var changed = false;
      
      inputs.forEach(function(input) {
        var sj = parseInt(input.dataset.subj);
        var sq = parseInt(input.dataset.seq);
        var v = parseFloat(input.value);
        
        if (!isNaN(v) && v >= 0 && v <= 20) {
          var ei = g.findIndex(function(x) { return x.subjectId === sj && x.sequenceId === sq; });
          var roundedV = roundToTwo(v);
          
          if (ei !== -1) {
            g[ei].value = roundedV;
            g[ei].date = new Date().toISOString().split('T')[0];
          } else {
            var nid = g.length > 0 ? Math.max.apply(null, g.map(function(x) { return x.id; })) + 1 : 1;
            g.push({
              id: nid,
              subjectId: sj,
              sequenceId: sq,
              value: roundedV,
              date: new Date().toISOString().split('T')[0]
            });
          }
          changed = true;
        }
      });
      
      if (changed) {
        saveStudentGrades(cu.id, g);
        playActionFeedback();
        showToast('✅ Grades saved successfully!');
        loadAddGrade();
      } else {
        showToast('⚠️ No valid grades to save');
      }
    }
    
    // Gestion des onglets
    document.querySelectorAll('.term-tab-btn').forEach(function(tab, index) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.term-tab-btn').forEach(function(t) {
          t.classList.remove('active');
        });
        tab.classList.add('active');
        cTerm = index + 1;
        loadAddGrade();
      });
    });
    
    loadAddGrade();
    initMobileMenu();
    initThemeSelector();
  </script>
</body>
</html>
