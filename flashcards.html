<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SMART GRADE - Flashcards</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Cinzel:wght@400;700&family=Quicksand:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Fredoka:wght@400;600;700&family=Pacifico&family=Bangers&family=Lobster&family=Permanent+Marker&family=Comfortaa:wght@300;400;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/night-mode.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f3b48">
  <style>
    .flashcard{
      perspective:1000px;
      width:100%;
      max-width:320px;
      height:200px;
      margin:0 auto 20px;
      cursor:pointer;
    }
    .flashcard-inner{
      position:relative;
      width:100%;
      height:100%;
      transition:transform 0.6s;
      transform-style:preserve-3d;
    }
    .flashcard.flipped .flashcard-inner{
      transform:rotateY(180deg);
    }
    .flashcard-front,.flashcard-back{
      position:absolute;
      width:100%;
      height:100%;
      backface-visibility:hidden;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      text-align:center;
      font-size:0.9rem;
      word-break:break-word;
    }
    .flashcard-front{
      background:var(--card-bg);
      border:1px solid var(--border);
      font-weight:600;
    }
    .flashcard-back{
      background:linear-gradient(135deg,var(--primary),var(--secondary));
      color:white;
      transform:rotateY(180deg);
    }
    .flashcard-counter{
      text-align:center;
      font-size:0.75rem;
      font-weight:600;
      color:var(--primary);
      margin:8px 0;
    }
    .flashcard-controls{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }
    .flashcard-controls button{
      width:auto;
      padding:10px 14px;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--card-bg);
      color:var(--text);
      cursor:pointer;
      font-size:0.8rem;
      transition:all 0.2s;
    }
    .flashcard-controls button:active{
      transform:scale(0.95);
    }
    .flashcard-controls button.primary{
      background:var(--primary);
      color:white;
      border:none;
    }
    .flashcard-controls button.danger{
      background:rgba(231,76,60,0.1);
      color:#e74c3c;
      border:1px solid rgba(231,76,60,0.3);
    }
    .flashcard-controls button.danger:active{
      transform:scale(0.95);
    }
    .form-group-flash{
      margin-bottom:12px;
    }
    .form-group-flash label{
      display:block;
      margin-bottom:4px;
      font-weight:500;
      color:var(--text-light);
      font-size:0.7rem;
    }
    .form-group-flash input{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--card-bg);
      color:var(--text);
      font-size:0.85rem;
      box-sizing:border-box;
    }
    .card-item{
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px;
      background:rgba(0,0,0,0.02);
      border-radius:10px;
      margin-bottom:6px;
    }
    .card-item.default-card{
      background:rgba(15,59,72,0.08);
      border-left:3px solid var(--primary);
    }
    .card-question{
      flex:1;
      font-size:0.7rem;
    }
    .card-question strong{
      color:var(--primary);
    }
    .card-question small{
      color:var(--text-light);
    }
    .default-badge{
      background:var(--primary);
      color:white;
      font-size:0.55rem;
      padding:2px 8px;
      border-radius:20px;
      margin-left:8px;
    }
    .delete-card-btn{
      background:none;
      border:none;
      color:#e74c3c;
      cursor:pointer;
      padding:8px;
      border-radius:8px;
      transition:all 0.2s;
    }
    .delete-card-btn:hover:not(:disabled){
      background:rgba(231,76,60,0.15);
      transform:scale(1.1);
    }
    .delete-card-btn:disabled{
      opacity:0.4;
      cursor:not-allowed;
      filter:grayscale(0.3);
    }
    .delete-card-btn:disabled:hover{
      transform:none;
      background:none;
    }
    .original-lock-icon{
      color:#95a5a6;
      font-size:0.7rem;
      margin-right:4px;
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="app-container">
    <div class="mobile-header">
      <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
      <div class="header-logo"><i class="fas fa-clone"></i><span>FLASHCARDS</span></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <a href="profile.html">
          <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;color:white;font-size:0.8rem;" id="headerAvatar">
            <i class="fas fa-user-graduate"></i>
          </div>
        </a>
        <div class="theme-btn-header" id="themeBtn"><i class="fas fa-palette"></i><span>Theme</span></div>
      </div>
    </div>
    <div class="sheet-overlay" id="sheetOverlay"></div>
    <div class="bottom-sheet" id="bottomSheet">
      <div class="bottom-sheet-header"><h3><i class="fas fa-brush"></i> Theme</h3><button class="close-sheet" id="closeSheet"><i class="fas fa-times"></i></button></div>
      <div class="bottom-sheet-content">
        <div class="theme-grid-rect" id="themeGrid"></div>
        <div class="font-row-sheet"><div class="font-sheet" data-font="small">A<sup>-</sup></div><div class="font-sheet" data-font="medium">A</div><div class="font-sheet" data-font="large">A<sup>+</sup></div></div>
      </div>
    </div>
    <div class="sidebar-menu" id="sidebarMenu">
      <div class="sidebar-header"><h3><i class="fas fa-graduation-cap"></i> SMART-GRADE MENU</h3><button class="close-sidebar" id="closeSidebar"><i class="fas fa-times"></i></button></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><i class="fas fa-chalkboard-user"></i> Dashboard</a>
        <a href="flashcards.html" class="nav-item active"><i class="fas fa-clone"></i> Flashcards</a>
        <a href="goals.html" class="nav-item"><i class="fas fa-bullseye"></i> Goals</a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i> Profile</a>
        <a href="settings.html" class="nav-item"><i class="fas fa-sliders-h"></i> Settings</a>
        <a href="#" class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </div>
    <div class="overlay" id="overlay"></div>
    <main class="main-content">
      
      <div class="glass-card text-center" style="background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;">
        <i class="fas fa-clone" style="font-size:40px;"></i>
        <h2 style="color:white;margin:8px 0;">Flashcards</h2>
        <p style="opacity:0.8;font-size:0.75rem;">Tap card to flip - Study smarter!</p>
      </div>
      
      <div class="glass-card">
        <label style="font-weight:500;color:var(--text-light);font-size:0.7rem;">
          <i class="fas fa-layer-group"></i> Select Subject (All 14 Subjects)
        </label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;" id="subjectSelector"></div>
      </div>
      
      <div class="glass-card">
        <div class="flashcard" id="flashcard" onclick="flipCard()">
          <div class="flashcard-inner">
            <div class="flashcard-front" id="fcFront"><p>Select a subject<br>to start studying</p></div>
            <div class="flashcard-back" id="fcBack"><p>Answer</p></div>
          </div>
        </div>
        <div class="flashcard-counter" id="fcCounter">0 / 0</div>
        <div class="flashcard-controls">
          <button onclick="prevCard()"><i class="fas fa-arrow-left"></i> Prev</button>
          <button class="primary" onclick="flipCard()"><i class="fas fa-sync-alt"></i> Flip</button>
          <button onclick="nextCard()"><i class="fas fa-arrow-right"></i> Next</button>
          <button class="danger" id="deleteCardBtn" onclick="deleteCurrentCard()" disabled><i class="fas fa-trash-alt"></i> Delete</button>
        </div>
      </div>
      
      <div class="glass-card">
        <h3><i class="fas fa-plus-circle"></i> Add New Card</h3>
        <div class="form-group-flash"><label><i class="fas fa-question"></i> Question</label><input type="text" id="newQuestion" placeholder="Enter question..."></div>
        <div class="form-group-flash"><label><i class="fas fa-lightbulb"></i> Answer</label><input type="text" id="newAnswer" placeholder="Enter answer..."></div>
        <button class="btn btn-primary" onclick="addCard()"><i class="fas fa-plus"></i> Add Card</button>
      </div>
      
      <div class="glass-card">
        <h3><i class="fas fa-list"></i> All Cards (<span id="totalCardsCount">0</span>)</h3>
        <div id="allCardsList" style="max-height:300px;overflow-y:auto;"></div>
      </div>
      
    </main>
  </div>
  
  <div id="toastContainer" class="toast-container"></div>
  
  <script src="js/utils.js"></script>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    var cu = null;
    var fcSubj = null;
    var fcCards = [];
    var fcIndex = 0;
    var fcFlipped = false;
    var allSaved = [];
    
    var ALL_SUBJECTS = [
      { id: 1, name: "COMPUTER SCIENCES", code: "CS", icon: "fa-laptop-code" },
      { id: 2, name: "MATHEMATICS", code: "MATH", icon: "fa-square-root-variable" },
      { id: 3, name: "CHEMISTRY", code: "CHM", icon: "fa-flask" },
      { id: 4, name: "HUMAN BIOLOGY", code: "HBIO", icon: "fa-dna" },
      { id: 5, name: "GEOLOGY", code: "GEL", icon: "fa-mountain" },
      { id: 6, name: "PHYSICS", code: "PHY", icon: "fa-atom" },
      { id: 7, name: "ADDITIONAL MATHEMATICS", code: "AMATH", icon: "fa-calculator" },
      { id: 8, name: "BIOLOGY", code: "BIO", icon: "fa-leaf" },
      { id: 9, name: "ECONOMICS", code: "ECO", icon: "fa-chart-line" },
      { id: 10, name: "ENGLISH LANGUAGE", code: "ENG", icon: "fa-language" },
      { id: 11, name: "GEOGRAPHY", code: "GEO", icon: "fa-earth-africa" },
      { id: 12, name: "CITIZENSHIP", code: "CIV", icon: "fa-landmark" },
      { id: 13, name: "FRENCH", code: "FR", icon: "fa-flag" },
      { id: 14, name: "FOOD AND NUTRITION", code: "FDN", icon: "fa-apple-whole" }
    ];
    
    var DEFAULT_CARDS = {
      1: [{ q: "What is an algorithm?", a: "A step-by-step procedure to solve a problem" }, { q: "What does CPU stand for?", a: "Central Processing Unit" }, { q: "What is binary code?", a: "Number system using only 0 and 1" }],
      2: [{ q: "What is the Pythagorean theorem?", a: "a² + b² = c²" }, { q: "What is Pi (π)?", a: "3.14159..." }, { q: "What is the area of a circle?", a: "π × r²" }],
      3: [{ q: "What is the chemical formula of water?", a: "H₂O" }, { q: "What does pH measure?", a: "Acidity or alkalinity" }, { q: "What is the symbol for gold?", a: "Au" }],
      4: [{ q: "What does DNA stand for?", a: "Deoxyribonucleic Acid" }, { q: "How many chromosomes do humans have?", a: "46" }, { q: "What do red blood cells do?", a: "Carry oxygen" }],
      5: [{ q: "What are the 3 types of rocks?", a: "Igneous, Sedimentary, Metamorphic" }, { q: "What is the hardest mineral?", a: "Diamond" }, { q: "What is magma?", a: "Molten rock" }],
      6: [{ q: "What is Newton's 2nd law?", a: "F = ma" }, { q: "What is the speed of light?", a: "300,000 km/s" }, { q: "What is the unit of force?", a: "Newton" }],
      7: [{ q: "What is a derivative?", a: "Rate of change" }, { q: "What is the integral of x?", a: "x²/2 + C" }, { q: "What is log₁₀(100)?", a: "2" }],
      8: [{ q: "What is photosynthesis?", a: "CO₂ + H₂O + light → Glucose + O₂" }, { q: "What are cell walls made of?", a: "Cellulose" }, { q: "What is mitosis?", a: "Cell division" }],
      9: [{ q: "What is the law of supply?", a: "Higher price → More supply" }, { q: "What does GDP stand for?", a: "Gross Domestic Product" }, { q: "What is inflation?", a: "General increase in prices" }],
      10: [{ q: "What is a noun?", a: "Person, place, thing, or idea" }, { q: "What is the past tense of 'go'?", a: "Went" }, { q: "What is the opposite of 'brave'?", a: "Cowardly" }],
      11: [{ q: "What is the capital of Cameroon?", a: "Yaoundé" }, { q: "What is the longest river?", a: "The Nile" }, { q: "What is the largest continent?", a: "Asia" }],
      12: [{ q: "What is democracy?", a: "Government by the people" }, { q: "What is a constitution?", a: "Supreme law" }, { q: "What is the national symbol of Cameroon?", a: "The Lion" }],
      13: [{ q: "How do you say 'Hello' in French?", a: "Bonjour" }, { q: "How do you say 'Thank you' in French?", a: "Merci" }, { q: "How do you say 'Goodbye' in French?", a: "Au revoir" }],
      14: [{ q: "What is a good source of Vitamin C?", a: "Citrus fruits" }, { q: "What is the function of proteins?", a: "Build and repair tissues" }, { q: "How many food groups are there?", a: "5" }]
    };
    
    function updateAvatar() {
      var headerAvatar = document.getElementById('headerAvatar');
      if (!headerAvatar) return;
      
      try {
        var stored = localStorage.getItem('smartgrade_current');
        if (!stored) {
          headerAvatar.innerHTML = '<i class="fas fa-user-graduate"></i>';
          return;
        }
        
        var user = JSON.parse(stored);
        var profile = JSON.parse(localStorage.getItem('smartgrade_profile_' + user.id) || '{"avatarBase64":""}');
        
        if (profile.avatarBase64 && profile.avatarBase64 !== '' && profile.avatarBase64.length > 100) {
          headerAvatar.innerHTML = '<img src="' + profile.avatarBase64 + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
        } else {
          headerAvatar.innerHTML = '<i class="fas fa-user-graduate"></i>';
        }
      } catch(e) {
        headerAvatar.innerHTML = '<i class="fas fa-user-graduate"></i>';
      }
    }
    
    function initFC() {
      cu = getCurrentStudent();
      if (!cu) {
        window.location.href = 'login.html';
        return;
      }
      allSaved = getFlashcards(cu.id);
      buildSubjectSelector();
      if (ALL_SUBJECTS.length > 0) selectSubject(ALL_SUBJECTS[0].id);
      updateAvatar();
    }
    
    function buildSubjectSelector() {
      var container = document.getElementById('subjectSelector');
      container.innerHTML = '';
      for (var i = 0; i < ALL_SUBJECTS.length; i++) {
        var s = ALL_SUBJECTS[i];
        var btn = document.createElement('button');
        btn.className = 'btn ' + (fcSubj === s.id ? 'btn-primary' : 'btn-secondary');
        btn.style.cssText = 'width:auto;padding:8px 12px;font-size:0.7rem;flex:1;min-width:80px;';
        btn.innerHTML = '<i class="fas ' + s.icon + '"></i> ' + s.code;
        btn.onclick = (function(sid) {
          return function() { selectSubject(sid); };
        })(s.id);
        container.appendChild(btn);
      }
    }
    
    function selectSubject(sid) {
      fcSubj = sid;
      fcIndex = 0;
      fcFlipped = false;
      allSaved = getFlashcards(cu.id);
      
      var userCardsForSubject = [];
      for (var i = 0; i < allSaved.length; i++) {
        if (allSaved[i].subjectId === fcSubj) {
          var cardCopy = JSON.parse(JSON.stringify(allSaved[i]));
          cardCopy.isOriginal = false;
          userCardsForSubject.push(cardCopy);
        }
      }
      
      var defaultCardsForSubject = [];
      if (DEFAULT_CARDS[fcSubj]) {
        for (var j = 0; j < DEFAULT_CARDS[fcSubj].length; j++) {
          var c = DEFAULT_CARDS[fcSubj][j];
          defaultCardsForSubject.push({
            id: 'default_' + fcSubj + '_' + j,
            subjectId: fcSubj,
            question: c.q,
            answer: c.a,
            isOriginal: true
          });
        }
      }
      
      fcCards = defaultCardsForSubject.concat(userCardsForSubject);
      
      var cardsToSave = [];
      for (var k = 0; k < fcCards.length; k++) {
        if (!fcCards[k].isOriginal) {
          cardsToSave.push({
            id: fcCards[k].id,
            subjectId: fcCards[k].subjectId,
            question: fcCards[k].question,
            answer: fcCards[k].answer,
            isOriginal: false,
            createdAt: fcCards[k].createdAt || new Date().toISOString()
          });
        }
      }
      saveFlashcards(cu.id, cardsToSave);
      
      updateCard();
      buildSubjectSelector();
      renderAllCardsList();
      updateAvatar();
    }
    
    function updateCard() {
      var deleteBtn = document.getElementById('deleteCardBtn');
      if (fcCards.length === 0) {
        document.getElementById('fcFront').innerHTML = '<p style="opacity:0.5;">No cards for this subject</p>';
        document.getElementById('fcBack').innerHTML = '<p style="opacity:0.5;">Add cards below</p>';
        document.getElementById('fcCounter').textContent = '0 / 0';
        document.getElementById('totalCardsCount').textContent = '0';
        if (deleteBtn) {
          deleteBtn.disabled = true;
          deleteBtn.innerHTML = '<i class="fas fa-trash-alt"></i> Delete';
        }
        return;
      }
      document.getElementById('fcFront').innerHTML = '<p style="font-weight:600;">' + escapeHtml(fcCards[fcIndex].question) + '</p>';
      document.getElementById('fcBack').innerHTML = '<p>' + escapeHtml(fcCards[fcIndex].answer) + '</p>';
      document.getElementById('fcCounter').textContent = (fcIndex + 1) + ' / ' + fcCards.length;
      document.getElementById('totalCardsCount').textContent = fcCards.length;
      document.getElementById('flashcard').classList.remove('flipped');
      fcFlipped = false;
      
      if (deleteBtn) {
        if (fcCards[fcIndex].isOriginal === true) {
          deleteBtn.disabled = true;
          deleteBtn.innerHTML = '<i class="fas fa-lock"></i> Locked';
          deleteBtn.title = "Original cards cannot be deleted";
        } else {
          deleteBtn.disabled = false;
          deleteBtn.innerHTML = '<i class="fas fa-trash-alt"></i> Delete';
          deleteBtn.title = "Delete this card";
        }
      }
    }
    
    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }
    
    function flipCard() {
      if (fcCards.length === 0) return;
      fcFlipped = !fcFlipped;
      var f = document.getElementById('flashcard');
      if (fcFlipped) f.classList.add('flipped');
      else f.classList.remove('flipped');
    }
    
    function prevCard() {
      if (fcCards.length === 0) return;
      fcIndex = (fcIndex - 1 + fcCards.length) % fcCards.length;
      updateCard();
    }
    
    function nextCard() {
      if (fcCards.length === 0) return;
      fcIndex = (fcIndex + 1) % fcCards.length;
      updateCard();
    }
    
    function addCard() {
      var q = document.getElementById('newQuestion').value.trim();
      var a = document.getElementById('newAnswer').value.trim();
      if (!q || !a) { showToast('Please enter both question and answer'); return; }
      if (!fcSubj) { showToast('Please select a subject first'); return; }
      
      var existingUserCards = getFlashcards(cu.id);
      var newCard = { 
        id: Date.now(), 
        subjectId: fcSubj, 
        question: q, 
        answer: a, 
        isOriginal: false, 
        createdAt: new Date().toISOString() 
      };
      existingUserCards.push(newCard);
      saveFlashcards(cu.id, existingUserCards);
      
      var subjectName = null;
      for (var i = 0; i < ALL_SUBJECTS.length; i++) {
        if (ALL_SUBJECTS[i].id === fcSubj) {
          subjectName = ALL_SUBJECTS[i].name;
          break;
        }
      }
      
      selectSubject(fcSubj);
      for (var j = 0; j < fcCards.length; j++) {
        if (fcCards[j].id === newCard.id) {
          fcIndex = j;
          break;
        }
      }
      updateCard();
      renderAllCardsList();
      document.getElementById('newQuestion').value = '';
      document.getElementById('newAnswer').value = '';
      playActionFeedback();
      showToast('Card added!');
      
      if (cu && cu.id && typeof checkFlashcardBadges === 'function') {
        checkFlashcardBadges(cu.id);
      }
      if (cu && cu.id && typeof checkAndUnlockAllNewBadges === 'function') {
        checkAndUnlockAllNewBadges(cu.id);
      }
    }
    
    function deleteCurrentCard() {
      if (fcCards.length === 0) { showToast('No cards to delete'); return; }
      var currentCard = fcCards[fcIndex];
      if (currentCard.isOriginal === true) { showToast('Original cards cannot be deleted'); return; }
      
      showConfirmDialog({
        title: 'Delete Card',
        message: 'Delete this flashcard?',
        detail: 'Question: ' + currentCard.question,
        icon: 'fa-trash-alt',
        iconColor: '#e74c3c',
        confirmText: 'Delete',
        onConfirm: function() {
          var userCards = getFlashcards(cu.id);
          var newUserCards = [];
          for (var i = 0; i < userCards.length; i++) {
            if (userCards[i].id !== currentCard.id) {
              newUserCards.push(userCards[i]);
            }
          }
          saveFlashcards(cu.id, newUserCards);
          selectSubject(fcSubj);
          if (fcCards.length === 0) fcIndex = 0;
          else if (fcIndex >= fcCards.length) fcIndex = fcCards.length - 1;
          updateCard();
          renderAllCardsList();
          showToast('Card deleted');
        }
      });
    }
    
    function deleteCardById(id) {
      var cardToDelete = null;
      for (var i = 0; i < fcCards.length; i++) {
        if (fcCards[i].id === id) {
          cardToDelete = fcCards[i];
          break;
        }
      }
      if (!cardToDelete) return;
      if (cardToDelete.isOriginal === true) { showToast('Original cards cannot be deleted'); return; }
      
      showConfirmDialog({
        title: 'Delete Card',
        message: 'Delete this flashcard?',
        detail: 'Question: ' + cardToDelete.question,
        icon: 'fa-trash-alt',
        iconColor: '#e74c3c',
        confirmText: 'Delete',
        onConfirm: function() {
          var userCards = getFlashcards(cu.id);
          var newUserCards = [];
          for (var i = 0; i < userCards.length; i++) {
            if (userCards[i].id !== id) {
              newUserCards.push(userCards[i]);
            }
          }
          saveFlashcards(cu.id, newUserCards);
          selectSubject(fcSubj);
          if (fcCards.length === 0) fcIndex = 0;
          else if (fcIndex >= fcCards.length) fcIndex = fcCards.length - 1;
          updateCard();
          renderAllCardsList();
          showToast('Card deleted');
        }
      });
    }
    
    function renderAllCardsList() {
      var container = document.getElementById('allCardsList');
      if (fcCards.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:var(--text-light);font-size:0.7rem;padding:20px;">No cards for this subject yet.<br>Add your first card above!</p>';
        return;
      }
      
      var html = '';
      for (var i = 0; i < fcCards.length; i++) {
        var c = fcCards[i];
        var isDefault = (c.isOriginal === true);
        var defaultBadge = isDefault ? '<span class="default-badge"><i class="fas fa-lock"></i> Original</span>' : '';
        var deleteButton = '';
        
        if (!isDefault) {
          deleteButton = '<button class="delete-card-btn" onclick="deleteCardById(' + c.id + ')" title="Delete card"><i class="fas fa-trash-alt"></i></button>';
        } else {
          deleteButton = '<button class="delete-card-btn" disabled title="Original cards cannot be deleted" style="opacity:0.5;cursor:not-allowed;"><i class="fas fa-lock"></i> Locked</button>';
        }
        
        html += '<div class="card-item ' + (isDefault ? 'default-card' : '') + '">' +
          '<div class="card-question">' +
            '<strong>Q:</strong> ' + escapeHtml(c.question) + '<br>' +
            '<small><strong>A:</strong> ' + escapeHtml(c.answer) + '</small>' +
            defaultBadge +
          '</div>' +
          deleteButton +
        '</div>';
      }
      container.innerHTML = html;
    }
    
    function showToast(message) {
      var container = document.getElementById('toastContainer');
      var toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = '<i class="fas fa-info-circle"></i> ' + message;
      container.appendChild(toast);
      setTimeout(function() {
        toast.style.opacity = '0';
        setTimeout(function() { if (toast.parentNode) toast.remove(); }, 300);
      }, 3000);
    }
    
    function playActionFeedback() {
      if (typeof navigator.vibrate === 'function') navigator.vibrate(30);
    }
    
    function showConfirmDialog(options) {
      var existingModal = document.querySelector('.custom-confirm-modal');
      if (existingModal) existingModal.remove();
      
      var modal = document.createElement('div');
      modal.className = 'custom-confirm-modal';
      modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:2000;display:flex;align-items:center;justify-content:center;';
      
      modal.innerHTML = `
        <div style="background:var(--card-bg);border-radius:24px;padding:24px;max-width:320px;width:85%;text-align:center;">
          <i class="fas ${options.icon || 'fa-exclamation-triangle'}" style="font-size:48px;color:${options.iconColor || '#e74c3c'};margin-bottom:16px;"></i>
          <h3 style="margin-bottom:8px;">${options.title}</h3>
          <p style="font-size:0.75rem;color:var(--text-light);margin-bottom:8px;">${options.message}</p>
          ${options.detail ? '<p style="font-size:0.7rem;font-weight:600;color:#e74c3c;margin-bottom:16px;">' + options.detail + '</p>' : ''}
          <div style="display:flex;gap:12px;">
            <button class="confirm-cancel-btn" style="flex:1;padding:12px;border-radius:40px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;">Cancel</button>
            <button class="confirm-ok-btn" style="flex:1;padding:12px;border-radius:40px;background:${options.confirmColor || '#e74c3c'};color:white;border:none;cursor:pointer;">${options.confirmText || 'Confirm'}</button>
          </div>
        </div>
      `;
      
      document.body.appendChild(modal);
      
      modal.querySelector('.confirm-cancel-btn').onclick = function() { modal.remove(); if (options.onCancel) options.onCancel(); };
      modal.querySelector('.confirm-ok-btn').onclick = function() { modal.remove(); if (options.onConfirm) options.onConfirm(); };
      modal.onclick = function(e) { if (e.target === modal) { modal.remove(); if (options.onCancel) options.onCancel(); } };
    }
    
    initFC();
    initMobileMenu();
    initThemeSelector();
    
    setInterval(updateAvatar, 2000);
    window.addEventListener('pageshow', updateAvatar);
    document.addEventListener('visibilitychange', function() { if (!document.hidden) updateAvatar(); });
  </script>
</body>
</html>
