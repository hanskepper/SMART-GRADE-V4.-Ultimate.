<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SMART GRADE - Goals</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Cinzel:wght@400;700&family=Quicksand:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Fredoka:wght@400;600;700&family=Pacifico&family=Bangers&family=Lobster&family=Permanent+Marker&family=Comfortaa:wght@300;400;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/night-mode.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f3b48">
  <style>
    .goal-card-new{background:var(--card-bg);border-radius:16px;padding:16px;margin-bottom:10px;border:1px solid var(--border);}
    .goal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
    .goal-subj-name{font-weight:600;font-size:0.8rem;display:flex;align-items:center;gap:8px;}
    .goal-subj-name i{color:var(--primary);}
    .goal-progress-bar{height:10px;border-radius:5px;background:rgba(0,0,0,0.05);overflow:hidden;margin:8px 0;}
    .goal-progress-fill{height:100%;border-radius:5px;transition:width 0.5s;}
    .goal-stats{display:flex;justify-content:space-between;font-size:0.65rem;color:var(--text-light);}
    .goal-achieved-badge{background:rgba(46,204,113,0.15);color:#27ae60;padding:2px 10px;border-radius:20px;font-size:0.6rem;}
    .term-tabs-row{display:flex;gap:6px;margin-bottom:16px;}
    .term-tab-btn{flex:1;padding:10px;border-radius:12px;text-align:center;cursor:pointer;font-weight:600;font-size:0.7rem;background:rgba(0,0,0,0.03);border:1px solid var(--border);transition:all 0.2s;}
    .term-tab-btn.active{background:var(--primary);color:white;border-color:var(--primary);}
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="app-container">
    <div class="mobile-header"><button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button><div class="header-logo"><i class="fas fa-bullseye"></i><span>GOALS</span></div><div style="display:flex;align-items:center;gap:8px;"><a href="profile.html"><div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;color:white;font-size:0.8rem;" id="headerAvatar"><i class="fas fa-user-graduate"></i></div></a><div class="theme-btn-header" id="themeBtn"><i class="fas fa-palette"></i><span>Theme</span></div></div></div>
    <div class="sheet-overlay" id="sheetOverlay"></div><div class="bottom-sheet" id="bottomSheet"><div class="bottom-sheet-header"><h3><i class="fas fa-brush"></i> Theme</h3><button class="close-sheet" id="closeSheet"><i class="fas fa-times"></i></button></div><div class="bottom-sheet-content"><div class="theme-grid-rect" id="themeGrid"></div><div class="font-row-sheet"><div class="font-sheet" data-font="small">A<sup>-</sup></div><div class="font-sheet" data-font="medium">A</div><div class="font-sheet" data-font="large">A<sup>+</sup></div></div></div></div>
    <div class="sidebar-menu" id="sidebarMenu"><div class="sidebar-header"><h3><i class="fas fa-graduation-cap"></i> MENU</h3><button class="close-sidebar" id="closeSidebar"><i class="fas fa-times"></i></button></div><nav class="sidebar-nav"><a href="dashboard.html" class="nav-item"><i class="fas fa-chalkboard-user"></i> Dashboard</a><a href="goals.html" class="nav-item active"><i class="fas fa-bullseye"></i> Goals</a><a href="settings.html" class="nav-item"><i class="fas fa-sliders-h"></i> Settings</a><a href="#" class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></nav></div>
    <div class="overlay" id="overlay"></div>
    <main class="main-content">
      
      <div class="term-tabs-row" id="termTabs">
        <div class="term-tab-btn active" data-term="1">Term 1</div>
        <div class="term-tab-btn" data-term="2">Term 2</div>
        <div class="term-tab-btn" data-term="3">Term 3</div>
      </div>
      
      <div id="goalsList"></div>
      
    </main>
  </div>
  <div id="toastContainer" class="toast-container"></div>
  <script src="js/utils.js"></script><script src="js/database.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script>
  <script>
    var cu=null,gTerm=1,sc=['#3498db','#e74c3c','#9b59b6','#2ecc71','#e67e22','#00bcd4','#f39c12','#1abc9c','#27ae60','#2980b9','#c0392b','#8e44ad','#16a085','#d35400'];
    
    function loadGoals(){cu=requireAuth();if(!cu)return;
      var subs=getActiveSubjectsWithCoefficients(cu.id,gTerm);
      var grades=getStudentGrades(cu.id);
      var goals=getGoalsDetail(cu.id);
      if(!goals[gTerm])goals[gTerm]={};
      
      document.getElementById('goalsList').innerHTML=subs.map(function(s,i){
        var sg=grades.filter(function(x){return x.subjectId===s.id&&(x.sequenceId===getSequencesForTerm(gTerm)[0]||x.sequenceId===getSequencesForTerm(gTerm)[1]);});
        var current=sg.length?roundToTwo(sg.reduce(function(a,b){return a+b.value;},0)/sg.length):0;
        var target=goals[gTerm][s.id]||Math.max(12,Math.round(current)||12);
        var pct=target>0?Math.min(100,Math.round((current/target)*100)):0;
        var achieved=current>=target&&current>0;
        var color=sc[i]||'#3498db';
        
        return'<div class="goal-card-new">'+
          '<div class="goal-header"><div class="goal-subj-name"><i class="fas '+s.icon+'" style="color:'+color+';"></i>'+s.name+'</div>'+
          (achieved?'<span class="goal-achieved-badge"><i class="fas fa-check-circle"></i> Achieved</span>':'')+'</div>'+
          '<div class="goal-stats"><span>Current: <strong>'+formatNumber(current)+'</strong></span><span>Target: <strong>'+formatNumber(target)+'</strong></span><span><strong>'+pct+'%</strong></span></div>'+
          '<div class="goal-progress-bar"><div class="goal-progress-fill" style="width:'+pct+'%;background:'+(achieved?'#2ecc71':color)+';"></div></div>'+
          '<input type="range" class="goal-slider" min="10" max="20" step="0.5" value="'+target+'" onchange="updateGoal('+s.id+',this.value)" style="width:100%;margin-top:8px;">'+
        '</div>';
      }).join('');
      
      initHeaderProfile();
    }
    
    function updateGoal(sid,val){
      var v=parseFloat(val);
      var goals=getGoalsDetail(cu.id);
      if(!goals[gTerm])goals[gTerm]={};
      goals[gTerm][sid]=v;
      saveGoalsDetail(cu.id,goals);
      loadGoals();
      showToast('Goal updated!');
    }
    
    document.querySelectorAll('.term-tab-btn').forEach(function(t,i){t.addEventListener('click',function(){document.querySelectorAll('.term-tab-btn').forEach(function(x){x.classList.remove('active');});t.classList.add('active');gTerm=i+1;loadGoals();});});
    loadGoals();initMobileMenu();initThemeSelector();
  </script>
</body>
</html>
