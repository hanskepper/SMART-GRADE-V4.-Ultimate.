<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SMART GRADE - Homework</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/night-mode.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f3b48">
  <style>
    .homework-header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      text-align: center;
      color: white;
    }
    .filter-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-select {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 0.8rem;
    }
    .homework-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .homework-card:hover { transform: translateX(4px); border-color: var(--primary); }
    .homework-title { font-size: 1rem; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
    .homework-subject {
      display: inline-block;
      background: rgba(15,59,72,0.1);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      margin-bottom: 12px;
    }
    .homework-description {
      font-size: 0.8rem;
      color: var(--text-light);
      line-height: 1.4;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .homework-date { font-size: 0.65rem; color: var(--text-light); }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
    .empty-state i { font-size: 60px; opacity: 0.2; margin-bottom: 16px; display: block; }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(5px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      border-radius: 24px;
      width: 90%;
      max-width: 700px;
      max-height: 85%;
      overflow-y: auto;
      padding: 24px;
      border: 1px solid var(--border);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h3 { color: var(--primary); font-size: 1.2rem; }
    .modal-close {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: var(--text-light);
    }
    @media (max-width: 550px) { .filter-bar { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="app-container">
    <div class="mobile-header">
      <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
      <div class="header-logo"><i class="fas fa-tasks"></i><span>HOMEWORK</span></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <a href="profile.html"><div id="headerAvatar" style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;color:white;"><i class="fas fa-user-graduate"></i></div></a>
        <div class="theme-btn-header" id="themeBtn"><i class="fas fa-palette"></i><span>Theme</span></div>
      </div>
    </div>
    
    <div class="sidebar-menu" id="sidebarMenu">
      <div class="sidebar-header"><h3><i class="fas fa-graduation-cap"></i> SMART-GRADE MENU</h3><button class="close-sidebar" id="closeSidebar"><i class="fas fa-times"></i></button></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><i class="fas fa-chalkboard-user"></i> Dashboard</a>
        <a href="homeworks.html" class="nav-item active"><i class="fas fa-tasks"></i> Homework</a>
        <a href="flashcards.html" class="nav-item"><i class="fas fa-clone"></i> Flashcards</a>
        <a href="goals.html" class="nav-item"><i class="fas fa-bullseye"></i> Goals</a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i> Profile</a>
        <a href="settings.html" class="nav-item"><i class="fas fa-sliders-h"></i> Settings</a>
        <a href="#" class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </div>
    <div class="overlay" id="overlay"></div>
    
    <main class="main-content">
      <div class="homework-header">
        <i class="fas fa-tasks" style="font-size:35px;opacity:0.5;"></i>
        <h2 style="color:white;margin:8px 0;">Homework & Assignments</h2>
        <p style="opacity:0.8;font-size:0.7rem;">All your tasks in one place</p>
      </div>
      
      <div class="glass-card">
        <div class="filter-bar">
          <select id="subjectFilter" class="filter-select">
            <option value="all">All Subjects</option>
            <option value="COMPUTER SCIENCES">Computer Sciences</option>
            <option value="MATHEMATICS">Mathematics</option>
            <option value="CHEMISTRY">Chemistry</option>
            <option value="PHYSICS">Physics</option>
            <option value="BIOLOGY">Biology</option>
            <option value="ENGLISH LANGUAGE">English</option>
            <option value="FRENCH">French</option>
            <option value="GEOGRAPHY">Geography</option>
            <option value="ECONOMICS">Economics</option>
            <option value="HUMAN BIOLOGY">Human Biology</option>
            <option value="GEOLOGY">Geology</option>
            <option value="ADDITIONAL MATHEMATICS">Additional Maths</option>
            <option value="CITIZENSHIP">Citizenship</option>
            <option value="FOOD AND NUTRITION">Food & Nutrition</option>
          </select>
        </div>
        <div id="homeworksList"></div>
      </div>
    </main>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Lire directement depuis GitHub (fichier public)
    const GITHUB_RAW_URL = 'https://raw.githubusercontent.com/hanskepper/SMART-GRADE-V4.-Ultimate./main/homeworks.json';
    
    let allHomeworks = [];
    
    async function loadHomeworks() {
      const user = getCurrentStudent();
      if (!user) { window.location.href = 'login.html'; return; }
      
      try {
        const response = await fetch(GITHUB_RAW_URL + '?v=' + Date.now());
        const data = await response.json();
        allHomeworks = data.homeworks || [];
        displayHomeworks();
        updateHeaderAvatar();
        showDeveloperLinks();
      } catch(e) {
        console.error('Error:', e);
        document.getElementById('homeworksList').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Unable to load homeworks. Please try again later.</p></div>';
      }
    }
    
    function showDeveloperLinks() {
      try {
        const stored = localStorage.getItem('smartgrade_current');
        if (stored) {
          const user = JSON.parse(stored);
          if (user.name === 'HANS KEPPER' && user.class === 'B2' && user.number === 9) {
            document.getElementById('devSidebarContainer').style.display = 'block';
          }
        }
      } catch(e) {}
    }
    
    function displayHomeworks() {
      const subject = document.getElementById('subjectFilter').value;
      let filtered = subject === 'all' ? allHomeworks : allHomeworks.filter(h => h.subject === subject);
      filtered.sort((a, b) => b.id - a.id);
      const container = document.getElementById('homeworksList');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-tasks"></i><p>No homework found.</p></div>';
        return;
      }
      let html = '';
      for (let h of filtered) {
        const due = h.dueDate ? new Date(h.dueDate).toLocaleDateString() : 'No deadline';
        html += `<div class="homework-card" onclick="openDetail(${h.id})">
          <div class="homework-title">${escapeHtml(h.title)}</div>
          <div class="homework-subject">${h.subject}</div>
          <div class="homework-description">${escapeHtml((h.description || '').substring(0, 100))}${(h.description || '').length > 100 ? '...' : ''}</div>
          <div class="homework-date"><i class="fas fa-calendar"></i> Due: ${due}</div>
        </div>`;
      }
      container.innerHTML = html;
    }
    
    function openDetail(id) {
      const h = allHomeworks.find(h => h.id === id);
      if (!h) return;
      document.getElementById('modalTitle').innerHTML = escapeHtml(h.title);
      document.getElementById('modalBody').innerHTML = `
        <div><strong>Subject:</strong> ${h.subject}</div>
        <div style="margin-top:12px;"><strong>Due Date:</strong> ${h.dueDate ? new Date(h.dueDate).toLocaleDateString() : 'No deadline'}</div>
        <div style="margin-top:12px;"><strong>Description:</strong><br>${escapeHtml(h.description || 'No description')}</div>
        <div style="margin-top:12px; font-size:0.6rem; color:var(--text-light);"><i class="fas fa-clock"></i> Posted: ${new Date(h.createdAt).toLocaleDateString()}</div>
      `;
      document.getElementById('detailModal').classList.add('active');
    }
    
    function closeModal() { document.getElementById('detailModal').classList.remove('active'); }
    function escapeHtml(t) { return t ? t.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')) : ''; }
    function updateHeaderAvatar() {
      const user = getCurrentStudent();
      if (!user) return;
      try {
        const profile = JSON.parse(localStorage.getItem('smartgrade_profile_' + user.id) || '{}');
        const avatar = document.getElementById('headerAvatar');
        if (profile.avatarBase64 && profile.avatarBase64.length > 100) {
          avatar.innerHTML = '<img src="' + profile.avatarBase64 + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
        }
      } catch(e) {}
    }
    
    document.getElementById('subjectFilter').addEventListener('change', displayHomeworks);
    document.getElementById('detailModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
    
    loadHomeworks();
    initMobileMenu();
    initThemeSelector();
  </script>
</body>
</html>
