<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SMART GRADE - Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Cinzel:wght@400;700&family=Quicksand:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Fredoka:wght@400;600;700&family=Pacifico&family=Bangers&family=Lobster&family=Permanent+Marker&family=Comfortaa:wght@300;400;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/night-mode.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f3b48">
  <style>
    .hero-card {
      text-align: center;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .hero-card i.hero-icon {
      font-size: 55px;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .hero-card h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero-card .school-info {
      font-size: 0.75rem;
      font-weight: 500;
    }
    .hero-card .year-info {
      font-size: 0.65rem;
      color: var(--text-light);
    }
    
    .stats-banner {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .stat-badge {
      text-align: center;
      padding: 14px 8px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    .stat-badge .num {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary);
    }
    .stat-badge .lbl {
      font-size: 0.6rem;
      color: var(--text-light);
      text-transform: uppercase;
      margin-top: 4px;
      letter-spacing: 1px;
    }
    
    .student-list-container { margin-top: 8px; }
    .student-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 8px;
      transition: all 0.2s ease;
    }
    .student-item:hover {
      transform: translateX(4px);
      border-color: var(--primary);
      background: rgba(0,0,0,0.02);
    }
    .student-info { display: flex; align-items: center; gap: 12px; }
    .student-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      color: white;
      font-size: 1.2rem;
    }
    .student-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .student-details { flex: 1; }
    .student-name { font-weight: 700; font-size: 0.85rem; margin-bottom: 2px; }
    .student-class { font-size: 0.6rem; color: var(--text-light); }
    .delete-btn {
      background: rgba(231,76,60,0.1);
      border: 1px solid rgba(231,76,60,0.3);
      color: #e74c3c;
      padding: 6px 14px;
      border-radius: 25px;
      font-size: 0.65rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .delete-btn:hover { background: #e74c3c; color: white; border-color: #e74c3c; }
    
    .show-more-btn {
      text-align: center;
      padding: 12px;
      margin-top: 12px;
      background: rgba(0,0,0,0.03);
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.7rem;
      color: var(--primary);
      border: 1px solid var(--border);
      transition: all 0.2s;
      font-weight: 500;
    }
    .show-more-btn:hover { background: rgba(0,0,0,0.06); }
    
    .empty-state { text-align: center; padding: 40px 20px; }
    .empty-state i { font-size: 50px; opacity: 0.2; margin-bottom: 12px; display: block; }
    .empty-state p { color: var(--text-light); font-size: 0.8rem; }
    
    .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .btn {
      padding: 14px 20px;
      border-radius: 40px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.85rem;
      width: 100%;
      transition: all 0.2s ease;
    }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
    .btn-primary:active { transform: scale(0.96); }
    .btn-secondary { background: rgba(0,0,0,0.05); color: var(--text); border: 1px solid var(--border); }
    
    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
    }
    
    @media (min-width: 768px) { .btn-group { flex-direction: row; } }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="app-container">
    <div class="mobile-header">
      <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
      <div class="header-logo"><i class="fas fa-home"></i><span>SMART GRADE</span></div>
      <div class="theme-btn-header" id="themeBtn"><i class="fas fa-palette"></i><span>Theme</span></div>
    </div>
    
    <div class="sheet-overlay" id="sheetOverlay"></div>
    <div class="bottom-sheet" id="bottomSheet">
      <div class="bottom-sheet-header"><h3><i class="fas fa-brush"></i> Theme</h3><button class="close-sheet" id="closeSheet"><i class="fas fa-times"></i></button></div>
      <div class="bottom-sheet-content">
        <div class="theme-grid-rect" id="themeGrid"></div>
        <div class="font-row-sheet"><div class="font-sheet" data-font="small">A<sup>-</sup></div><div class="font-sheet" data-font="medium">A</div><div class="font-sheet" data-font="large">A<sup>+</sup></div></div>
      </div>
    </div>
    
    <div class="sidebar-menu" id="sidebarMenu">
      <div class="sidebar-header"><h3><i class="fas fa-graduation-cap"></i> MENU</h3><button class="close-sidebar" id="closeSidebar"><i class="fas fa-times"></i></button></div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item active"><i class="fas fa-home"></i> Home</a>
        <a href="login.html" class="nav-item"><i class="fas fa-sign-in-alt"></i> Login</a>
        <a href="register.html" class="nav-item"><i class="fas fa-user-plus"></i> Register</a>
        <a href="guide.html" class="nav-item"><i class="fas fa-question-circle"></i> Guide</a>
        <a href="about.html" class="nav-item"><i class="fas fa-info-circle"></i> About</a>
      </nav>
    </div>
    <div class="overlay" id="overlay"></div>
    
    <main class="main-content">
      
      <div class="glass-card hero-card">
        <i class="fas fa-chalkboard-user hero-icon"></i>
        <h1>SMART GRADE</h1>
        <p class="school-info">SIN GBHS FOUMBAN Form 4B Science</p>
        <p class="year-info">Academic Year 2025-2026</p>
      </div>
      
      <div class="stats-banner">
        <div class="stat-badge"><div class="num" id="totalStudents">0</div><div class="lbl">Students</div></div>
        <div class="stat-badge"><div class="num">14</div><div class="lbl">Subjects</div></div>
        <div class="stat-badge"><div class="num">20</div><div class="lbl">Themes</div></div>
      </div>
      
      <div class="glass-card">
        <div class="section-title"><i class="fas fa-users"></i> Select Account</div>
        <div class="student-list-container" id="studentsList"></div>
      </div>
      
      <div class="btn-group">
        <a href="login.html" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> Login</a>
        <a href="register.html" class="btn btn-secondary"><i class="fas fa-user-plus"></i> Create Account</a>
      </div>
      
    </main>
  </div>
  
  <!-- DELETE MODAL -->
  <div id="deleteModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:400;align-items:center;justify-content:center;">
    <div style="background:var(--card-bg);border-radius:24px;padding:24px;width:85%;max-width:340px;text-align:center;">
      <i class="fas fa-exclamation-triangle" style="font-size:50px;color:#e74c3c;margin-bottom:12px;"></i>
      <h3>Delete Account</h3>
      <p style="font-size:0.7rem;color:var(--text-light);margin-bottom:16px;">Enter PIN to confirm</p>
      <input type="text" id="deletePin" maxlength="4" placeholder="****" style="width:100%;padding:12px;border-radius:12px;border:2px solid var(--border);text-align:center;font-size:1.2rem;background:var(--card-bg);color:var(--text);margin-bottom:16px;">
      <div style="display:flex;gap:10px;">
        <button class="btn-cancel-modal" style="flex:1;padding:12px;border-radius:30px;border:1px solid var(--border);background:transparent;cursor:pointer;">Cancel</button>
        <button class="btn-confirm-delete" style="flex:1;padding:12px;border-radius:30px;background:#e74c3c;color:white;border:none;cursor:pointer;">Delete</button>
      </div>
    </div>
  </div>
  
  <div id="toastContainer" class="toast-container"></div>
  <div class="install-prompt" id="installPrompt">
    <i class="fas fa-mobile-alt"></i>
    <div class="install-prompt-text"><h4>Install SMART GRADE</h4><p>Add to home screen</p></div>
    <button onclick="installApp()">Install</button>
  </div>
  
  <script src="js/utils.js"></script>
  <script src="js/database.js"></script>
  <script src="js/install-handler.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    var currentDeleteId = null;
    var showAllAccounts = false;
    
    function getStudentAvatarHtml(avatarBase64) {
      if (avatarBase64 && avatarBase64 !== '') return '<img src="' + avatarBase64 + '">';
      return '<i class="fas fa-user-graduate"></i>';
    }
    
    function getRecentAccounts() { return JSON.parse(localStorage.getItem('smartgrade_recent_accounts') || '[]'); }
    
    function renderStudents() {
      var allStudents = getAllStudents();
      var recentIds = getRecentAccounts();
      document.getElementById('totalStudents').innerHTML = allStudents.length;
      
      var sortedStudents = [];
      recentIds.forEach(function(id) { var student = allStudents.find(function(s) { return s.id === id; }); if (student) sortedStudents.push(student); });
      allStudents.forEach(function(student) { if (recentIds.indexOf(student.id) === -1) sortedStudents.push(student); });
      var displayStudents = showAllAccounts ? sortedStudents : sortedStudents.slice(0, 3);
      
      if (displayStudents.length === 0) {
        document.getElementById('studentsList').innerHTML = '<div class="empty-state"><i class="fas fa-users-slash"></i><p>No accounts yet</p><a href="register.html" class="btn btn-primary" style="display:inline-flex;width:auto;padding:10px 20px;font-size:0.75rem;"><i class="fas fa-user-plus"></i> Create Account</a></div>';
        return;
      }
      
      var html = '';
      displayStudents.forEach(function(student) {
        var profile = getProfile(student.id);
        var avatarHtml = getStudentAvatarHtml(profile.avatarBase64);
        html += '<div class="student-item"><div class="student-info"><div class="student-avatar">' + avatarHtml + '</div><div class="student-details"><div class="student-name">' + escapeHtml(student.name) + '</div><div class="student-class">' + student.class + ' #' + student.number + '</div></div></div><button class="delete-btn" onclick="showDeleteModal(' + student.id + ')"><i class="fas fa-trash-alt"></i> Delete</button></div>';
      });
      
      if (!showAllAccounts && sortedStudents.length > 3) {
        html += '<div class="show-more-btn" onclick="toggleShowAll()"><i class="fas fa-chevron-down"></i> Show all (' + sortedStudents.length + ' accounts)</div>';
      } else if (showAllAccounts && sortedStudents.length > 3) {
        html += '<div class="show-more-btn" onclick="toggleShowAll()"><i class="fas fa-chevron-up"></i> Show less</div>';
      }
      document.getElementById('studentsList').innerHTML = html;
    }
    
    function toggleShowAll() { showAllAccounts = !showAllAccounts; renderStudents(); }
    
    function showDeleteModal(id) { currentDeleteId = id; var modal = document.getElementById('deleteModal'); modal.style.display = 'flex'; document.getElementById('deletePin').value = ''; document.getElementById('deletePin').focus(); }
    function closeDeleteModal() { document.getElementById('deleteModal').style.display = 'none'; currentDeleteId = null; }
    
    function confirmDelete() {
      var pin = document.getElementById('deletePin').value;
      var student = getStudentById(currentDeleteId);
      if (!student) { showToast('Account not found'); closeDeleteModal(); return; }
      if (student.pin !== pin) { showToast('Wrong PIN'); closeDeleteModal(); return; }
      var recent = getRecentAccounts();
      recent = recent.filter(function(id) { return id !== currentDeleteId; });
      localStorage.setItem('smartgrade_recent_accounts', JSON.stringify(recent));
      deleteStudent(currentDeleteId);
      renderStudents();
      showToast(student.name + ' deleted');
      closeDeleteModal();
    }
    
    function escapeHtml(text) { if (!text) return ''; return text.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
    
    document.getElementById('deleteModal').addEventListener('click', function(e) { if (e.target === this) closeDeleteModal(); });
    document.querySelector('.btn-cancel-modal').onclick = closeDeleteModal;
    document.querySelector('.btn-confirm-delete').onclick = confirmDelete;
    document.getElementById('deletePin').addEventListener('keypress', function(e) { if (e.key === 'Enter') confirmDelete(); });
    
    window.showDeleteModal = showDeleteModal;
    window.closeDeleteModal = closeDeleteModal;
    window.confirmDelete = confirmDelete;
    window.toggleShowAll = toggleShowAll;
    
    renderStudents();
    initMobileMenu();
    initThemeSelector();
    
    setTimeout(function() { if (typeof applyGlobalFont === 'function') applyGlobalFont(); }, 100);
  </script>
</body>
</html>
