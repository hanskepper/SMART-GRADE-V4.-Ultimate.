<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SMART GRADE - No Connection</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/night-mode.css">
  
  <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.14/dist/dotlottie-wc.js" type="module"></script>
  
  <meta name="theme-color" content="#0f3b48">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
      transition: background 0.3s ease;
    }
    
    .offline-card {
      background: var(--card-bg);
      border-radius: 32px;
      padding: 40px 28px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      border: 1px solid var(--border);
      animation: fadeInUp 0.6s ease;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .offline-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0, 255, 255, 0.03) 10px, rgba(0, 255, 255, 0.03) 20px);
      animation: stripeMove 3s linear infinite;
      z-index: 0;
    }
    
    @keyframes stripeMove {
      0% { background-position: 0 0; }
      100% { background-position: 40px 0; }
    }
    
    .offline-card > * {
      position: relative;
      z-index: 1;
    }
    
    dotlottie-wc {
      width: 180px;
      height: 180px;
      margin: 0 auto 16px;
      display: block;
    }
    
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    
    .message {
      font-size: 0.85rem;
      color: var(--text-light);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    
    .retry-btn {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      margin-bottom: 16px;
    }
    
    .retry-btn:active {
      transform: scale(0.97);
    }
    
    .hint {
      font-size: 0.65rem;
      color: var(--text-light);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .hint i {
      color: var(--primary);
    }
    
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #e74c3c;
      border-radius: 50%;
      animation: blink 1.5s infinite;
      margin-right: 6px;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  
  <div class="offline-card">
    
    <div id="lottieContainer"></div>
    
    <h1>No Internet</h1>
    
    <div class="message">
      <span class="status-dot"></span> No connection detected<br>
      Please enable Wi-Fi or mobile data to continue.
    </div>
    
    <button class="retry-btn" onclick="checkConnection()">
      <i class="fas fa-sync-alt"></i> Try Again
    </button>
    
    <div class="hint">
      <i class="fas fa-lightbulb"></i>
      <span>Check your network settings</span>
    </div>
  </div>

  <script>
    // ============================================
    // 3 ANIMATIONS LOTTIE POUR OFFLINE
    // ============================================
    
    var LOTTIE_ANIMATIONS = [
      'https://lottie.host/28bc944e-41d8-41c1-9369-607664a75755/AZIpc2nJGU.lottie',
      'https://lottie.host/9d724b49-0483-4521-a0a7-6f332ba03ae7/qgYZXkWnKE.lottie',
      'https://lottie.host/0a381419-7bd3-48cc-8b0a-1f0647220ad1/5ATVJvCLYC.lottie'
    ];
    
    // ============================================
    // 20 THÈMES (comme splash.html)
    // ============================================
    
    var THEMES_LIST = [
      'default', 'crimson', 'forest', 'ocean', 'royal',
      'sunset', 'rose', 'turquoise', 'amber', 'graphite',
      'lavender', 'cherry', 'midnight', 'mint', 'coral',
      'indigo', 'chocolate', 'electric', 'steel', 'lime'
    ];
    
    var lastTheme = null;
    var lastAnimation = null;
    
    // ============================================
    // SÉLECTION ALEATOIRE SANS RÉPÉTITION
    // ============================================
    
    function getRandomItemWithoutRepeat(list, lastItem) {
      var available = list.filter(function(item) {
        return item !== lastItem;
      });
      
      if (available.length === 0) {
        available = list;
      }
      
      var randomIndex = Math.floor(Math.random() * available.length);
      return available[randomIndex];
    }
    
    // ============================================
    // APPLIQUER THÈME ALÉATOIRE
    // ============================================
    
    function applyRandomTheme() {
      var selectedTheme = getRandomItemWithoutRepeat(THEMES_LIST, lastTheme);
      
      document.body.className = document.body.className.replace(/theme-\w+/g, '').trim();
      document.body.classList.add('theme-' + selectedTheme);
      
      lastTheme = selectedTheme;
      localStorage.setItem('smartgrade_last_offline_theme', selectedTheme);
      
      console.log('[Offline] Theme applied:', selectedTheme);
    }
    
    // ============================================
    // APPLIQUER ANIMATION ALÉATOIRE
    // ============================================
    
    function applyRandomAnimation() {
      var selectedAnimation = getRandomItemWithoutRepeat(LOTTIE_ANIMATIONS, lastAnimation);
      
      var container = document.getElementById('lottieContainer');
      container.innerHTML = '';
      
      var lottieElement = document.createElement('dotlottie-wc');
      lottieElement.setAttribute('src', selectedAnimation);
      lottieElement.setAttribute('autoplay', '');
      lottieElement.setAttribute('loop', '');
      lottieElement.style.width = '180px';
      lottieElement.style.height = '180px';
      lottieElement.style.margin = '0 auto';
      lottieElement.style.display = 'block';
      
      container.appendChild(lottieElement);
      
      lastAnimation = selectedAnimation;
      localStorage.setItem('smartgrade_last_offline_animation', selectedAnimation);
      
      console.log('[Offline] Animation applied:', selectedAnimation.split('/').pop());
    }
    
    // ============================================
    // CONNEXION CHECK
    // ============================================
    
    function checkConnection() {
      var btn = document.querySelector('.retry-btn');
      var originalHTML = btn.innerHTML;
      
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';
      btn.disabled = true;
      
      setTimeout(function() {
        if (navigator.onLine) {
          window.location.href = 'index.html';
        } else {
          btn.innerHTML = originalHTML;
          btn.disabled = false;
          
          btn.style.animation = 'shake 0.5s ease';
          setTimeout(function() {
            btn.style.animation = '';
          }, 500);
        }
      }, 1500);
    }
    
    var style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
    `;
    document.head.appendChild(style);
    
    // ============================================
    // CHARGEMENT DE LA PAGE
    // ============================================
    
    var savedTheme = localStorage.getItem('smartgrade_last_offline_theme');
    var savedAnimation = localStorage.getItem('smartgrade_last_offline_animation');
    
    if (savedTheme && THEMES_LIST.indexOf(savedTheme) !== -1) {
      lastTheme = savedTheme;
    }
    
    if (savedAnimation && LOTTIE_ANIMATIONS.indexOf(savedAnimation) !== -1) {
      lastAnimation = savedAnimation;
    }
    
    applyRandomTheme();
    applyRandomAnimation();
    
    // Reconnexion automatique
    window.addEventListener('online', function() {
      window.location.href = 'index.html';
    });
    
    if (typeof initParticles === 'function') initParticles();
    if (typeof applyGlobalFont === 'function') applyGlobalFont();
  </script>
</body>
</html>
