<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SMART GRADE - Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Cinzel:wght@400;700&family=Quicksand:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Fredoka:wght@400;600;700&family=Pacifico&family=Bangers&family=Lobster&family=Permanent+Marker&family=Comfortaa:wght@300;400;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/night-mode.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f3b48">
  <style>
    .avatar-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 16px;
    }
    .avatar-preview-large {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--primary);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .avatar-preview-large:hover {
      transform: scale(1.02);
    }
    .avatar-preview-large img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar-preview-large i {
      font-size: 48px;
      color: white;
    }
    .btn-add-avatar {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: 3px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .btn-add-avatar:active {
      transform: scale(0.92);
    }
    .btn-add-avatar i {
      font-size: 16px;
      color: white;
    }
    .upload-hint {
      text-align: center;
      font-size: 0.65rem;
      color: var(--text-light);
      margin-top: 8px;
    }
    .btn-remove-avatar {
      background: rgba(231,76,60,0.15);
      border: 1px solid rgba(231,76,60,0.3);
      color: #e74c3c;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 12px;
    }
    .btn-remove-avatar:active {
      transform: scale(0.95);
    }
    
    .avatar-zoom-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .avatar-zoom-modal.active {
      display: flex;
    }
    .avatar-zoom-modal img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(255,255,255,0.15);
      animation: zoomIn 0.3s ease;
    }
    @keyframes zoomIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .avatar-zoom-modal .close-zoom {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 28px;
      color: white;
      transition: all 0.2s;
    }
    .avatar-zoom-modal .close-zoom:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.1);
    }
    
    /* Badges en grille ordonnée */
    .badges-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .badge-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(0,0,0,0.03);
      border-radius: 30px;
      font-size: 0.7rem;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .badge-item:hover {
      transform: translateX(4px);
      border-color: var(--primary);
    }
    .badge-item i {
      width: 24px;
      color: #f39c12;
      font-size: 0.9rem;
    }
    .badge-item .badge-name {
      flex: 1;
      font-weight: 500;
    }
    .badge-item .badge-date {
      font-size: 0.55rem;
      color: var(--text-light);
    }
    .badge-item.locked {
      opacity: 0.5;
      filter: grayscale(0.3);
    }
    .badge-item.locked i {
      color: #95a5a6;
    }
    .badges-section h3 {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badges-section .badge-count {
      background: var(--primary);
      color: white;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
    }
    @media (max-width: 550px) {
      .badges-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="app-container">
    <div class="mobile-header">
      <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
      <div class="header-logo"><i class="fas fa-user"></i><span>PROFILE</span></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;color:white;font-size:0.8rem;" id="headerAvatar">
          <i class="fas fa-user-graduate"></i>
        </div>
        <div class="theme-btn-header" id="themeBtn"><i class="fas fa-palette"></i><span>Theme</span></div>
      </div>
    </div>
    <div class="sheet-overlay" id="sheetOverlay"></div>
    <div class="bottom-sheet" id="bottomSheet">
      <div class="bottom-sheet-header"><h3><i class="fas fa-brush"></i> Theme</h3><button class="close-sheet" id="closeSheet"><i class="fas fa-times"></i></button></div>
      <div class="bottom-sheet-content">
        <div class="theme-grid-rect" id="themeGrid"></div>
        <div class="font-row-sheet">
          <div class="font-sheet" data-font="small">A<sup>-</sup></div>
          <div class="font-sheet" data-font="medium">A</div>
          <div class="font-sheet" data-font="large">A<sup>+</sup></div>
        </div>
      </div>
    </div>
    <div class="sidebar-menu" id="sidebarMenu">
      <div class="sidebar-header"><h3><i class="fas fa-graduation-cap"></i> MENU</h3><button class="close-sidebar" id="closeSidebar"><i class="fas fa-times"></i></button></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><i class="fas fa-chalkboard-user"></i> Dashboard</a>
        <a href="profile.html" class="nav-item active"><i class="fas fa-user"></i> Profile</a>
        <a href="settings.html" class="nav-item"><i class="fas fa-sliders-h"></i> Settings</a>
        <a href="#" class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </div>
    <div class="overlay" id="overlay"></div>
    <main class="main-content">
      
      <div class="glass-card text-center">
        <div class="avatar-container">
          <div class="avatar-preview-large" id="avatarPreview">
            <div class="avatar-placeholder">
              <i class="fas fa-user-graduate"></i>
            </div>
          </div>
          <div class="btn-add-avatar" onclick="triggerFileUpload()">
            <i class="fas fa-plus"></i>
          </div>
        </div>
        <div class="upload-hint">
          <i class="fas fa-info-circle"></i> Tap the + button to add a photo | Tap photo to zoom
        </div>
        <input type="file" id="avatarFileInput" accept="image/jpeg,image/png,image/jpg,image/gif,image/webp" style="display:none;" onchange="handleImageUpload(event)">
        
        <h2 id="profileName" style="word-break:break-word; margin-top:12px;">--</h2>
        <p style="color:var(--text-light);font-size:0.75rem;" id="profileInfo"></p>
        
        <button class="btn-remove-avatar" onclick="removeAvatar()" style="display:none;" id="removeAvatarBtn">
          <i class="fas fa-trash"></i> Remove Photo
        </button>
      </div>
      
      <div class="glass-card">
        <h3><i class="fas fa-edit"></i> Bio</h3>
        <textarea id="profileBio" placeholder="Write something about yourself..." style="width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);font-size:0.8rem;min-height:60px;resize:vertical;max-width:100%;box-sizing:border-box;"></textarea>
        <button class="btn btn-primary mt-1" onclick="saveProfileData()"><i class="fas fa-save"></i> Save Profile</button>
        <p id="saveStatus" style="font-size:0.6rem;color:#2ecc71;text-align:center;margin-top:6px;display:none;"><i class="fas fa-check-circle"></i> Profile saved!</p>
      </div>
      
      <div class="glass-card badges-section">
        <h3><i class="fas fa-medal"></i> Your Badges <span class="badge-count" id="badgeCount">0</span></h3>
        <div id="profileBadges" class="badges-grid"></div>
      </div>
      
    </main>
  </div>
  
  <div class="avatar-zoom-modal" id="avatarZoomModal" onclick="closeAvatarZoom()">
    <div class="close-zoom" onclick="closeAvatarZoom()">&times;</div>
    <img id="zoomAvatarImg" src="" alt="Avatar zoom">
  </div>
  
  <div id="toastContainer" class="toast-container"></div>
  
  <script src="js/utils.js"></script>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    var cu = null;
    var currentAvatarBase64 = '';
    
    // Ordre des badges (identique à achievements.html)
    var BADGES_ORDER = [
      { id: 1, name: 'First Grade', icon: 'fa-pen' },
      { id: 2, name: 'Perfect Score', icon: 'fa-star' },
      { id: 3, name: 'High Average', icon: 'fa-arrow-up' },
      { id: 4, name: 'Bookworm', icon: 'fa-book-open' },
      { id: 5, name: 'Dedication', icon: 'fa-fire' },
      { id: 6, name: 'Scholar', icon: 'fa-graduation-cap' },
      { id: 7, name: 'Rising Star', icon: 'fa-rocket' },
      { id: 8, name: 'Unstoppable', icon: 'fa-bolt' },
      { id: 9, name: 'Subject Completion', icon: 'fa-check-double' },
      { id: 10, name: 'Active Semester', icon: 'fa-calendar-check' },
      { id: 11, name: 'Discipline Mastery', icon: 'fa-crown' },
      { id: 12, name: 'Study Progress', icon: 'fa-chart-bar' },
      { id: 13, name: 'Full Achievement', icon: 'fa-trophy' },
      { id: 14, name: 'Excellent Result', icon: 'fa-medal' }
    ];
    
    function resizeImage(file, maxWidth, maxHeight, callback) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var width = img.width;
          var height = img.height;
          
          if (width > height) {
            if (width > maxWidth) {
              height = Math.round(height * (maxWidth / width));
              width = maxWidth;
            }
          } else {
            if (height > maxHeight) {
              width = Math.round(width * (maxHeight / height));
              height = maxHeight;
            }
          }
          
          var canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          var base64 = canvas.toDataURL('image/jpeg', 0.8);
          callback(base64);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
    
    function triggerFileUpload() {
      document.getElementById('avatarFileInput').click();
    }
    
    function handleImageUpload(event) {
      var file = event.target.files[0];
      if (!file) return;
      
      if (!file.type.match('image.*')) {
        showToast('Please select an image file');
        return;
      }
      
      if (file.size > 5 * 1024 * 1024) {
        showToast('Image too large (max 5MB)');
        return;
      }
      
      showToast('Processing image...');
      
      resizeImage(file, 300, 300, function(base64) {
        currentAvatarBase64 = base64;
        
        var previewDiv = document.getElementById('avatarPreview');
        previewDiv.innerHTML = '<img src="' + base64 + '" alt="Avatar">';
        
        document.getElementById('removeAvatarBtn').style.display = 'inline-block';
        
        saveProfileData();
        
        showToast('Photo added successfully!');
        initAvatarClick();
      });
      
      event.target.value = '';
    }
    
    function removeAvatar() {
      if (confirm('Remove your profile photo?')) {
        currentAvatarBase64 = '';
        
        var previewDiv = document.getElementById('avatarPreview');
        previewDiv.innerHTML = '<div class="avatar-placeholder"><i class="fas fa-user-graduate"></i></div>';
        
        document.getElementById('removeAvatarBtn').style.display = 'none';
        
        saveProfileData();
        
        showToast('Photo removed');
        initAvatarClick();
      }
    }
    
    function openAvatarZoom() {
      var previewDiv = document.getElementById('avatarPreview');
      var img = previewDiv.querySelector('img');
      
      if (img && img.src && img.src !== '') {
        var zoomImg = document.getElementById('zoomAvatarImg');
        zoomImg.src = img.src;
        document.getElementById('avatarZoomModal').classList.add('active');
      } else {
        showToast('No photo to zoom');
      }
    }
    
    function closeAvatarZoom() {
      document.getElementById('avatarZoomModal').classList.remove('active');
    }
    
    function initAvatarClick() {
      var avatarPreview = document.getElementById('avatarPreview');
      if (avatarPreview) {
        avatarPreview.style.cursor = 'pointer';
        avatarPreview.onclick = function(e) {
          e.stopPropagation();
          openAvatarZoom();
        };
      }
    }
    
    function loadProfile() {
      cu = requireAuth();
      if (!cu) return;
      
      var profile = getProfile(cu.id);
      
      document.getElementById('profileName').textContent = cu.name;
      document.getElementById('profileInfo').innerHTML = '<strong>' + cu.class + ' - #' + cu.number + '</strong><br>Member since ' + formatDate(cu.createdAt);
      
      document.getElementById('profileBio').value = profile.bio || '';
      
      if (profile.avatarBase64 && profile.avatarBase64 !== '') {
        currentAvatarBase64 = profile.avatarBase64;
        var previewDiv = document.getElementById('avatarPreview');
        previewDiv.innerHTML = '<img src="' + currentAvatarBase64 + '" alt="Avatar">';
        document.getElementById('removeAvatarBtn').style.display = 'inline-block';
      } else {
        currentAvatarBase64 = '';
        var previewDiv = document.getElementById('avatarPreview');
        previewDiv.innerHTML = '<div class="avatar-placeholder"><i class="fas fa-user-graduate"></i></div>';
        document.getElementById('removeAvatarBtn').style.display = 'none';
      }
      
      initAvatarClick();
      initHeaderProfile();
      
      // Afficher les badges dans l'ordre
      var achievements = getStudentAchievements(cu.id);
      var unlockedMap = {};
      for (var i = 0; i < achievements.length; i++) {
        unlockedMap[achievements[i].id] = achievements[i];
      }
      
      var unlockedCount = 0;
      var badgesHtml = '';
      
      for (var i = 0; i < BADGES_ORDER.length; i++) {
        var badge = BADGES_ORDER[i];
        var achievement = unlockedMap[badge.id];
        var isUnlocked = achievement && achievement.unlocked;
        var unlockDate = achievement ? achievement.unlockDate : null;
        
        if (isUnlocked) unlockedCount++;
        
        badgesHtml += '<div class="badge-item ' + (isUnlocked ? '' : 'locked') + '">' +
          '<i class="fas ' + badge.icon + '"></i>' +
          '<span class="badge-name">' + badge.name + '</span>' +
          (isUnlocked ? '<span class="badge-date"><i class="fas fa-check-circle" style="color:#2ecc71;"></i> ' + (unlockDate || 'Unlocked') + '</span>' : '<span class="badge-date"><i class="fas fa-lock" style="color:#95a5a6;"></i> Locked</span>') +
        '</div>';
      }
      
      document.getElementById('profileBadges').innerHTML = badgesHtml;
      document.getElementById('badgeCount').innerHTML = unlockedCount + ' / 14';
    }
    
    function saveProfileData() {
      var profile = getProfile(cu.id);
      profile.avatarBase64 = currentAvatarBase64;
      profile.bio = document.getElementById('profileBio').value;
      saveProfile(cu.id, profile);
      
      initHeaderProfile();
      
      playActionFeedback();
      
      var statusMsg = document.getElementById('saveStatus');
      statusMsg.style.display = 'block';
      setTimeout(function() { statusMsg.style.display = 'none'; }, 2000);
      
      showToast('Profile saved!');
    }
    
    loadProfile();
    initMobileMenu();
    initThemeSelector();
  </script>
</body>
</html>
