<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SMART GRADE - Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Cinzel:wght@400;700&family=Quicksand:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Fredoka:wght@400;600;700&family=Pacifico&family=Bangers&family=Lobster&family=Permanent+Marker&family=Comfortaa:wght@300;400;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/night-mode.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f3b48">
  <style>
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-light); font-size: 0.75rem; }
    .form-group label i { width: 20px; color: var(--primary); margin-right: 6px; }
    .form-group input { width: 100%; padding: 14px; border-radius: 14px; border: 2px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 0.9rem; transition: all 0.2s; box-sizing: border-box; }
    .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15,59,72,0.1); }
    .flex-row { display: flex; gap: 12px; flex-wrap: wrap; }
    
    /* CORRECTION MODE SOMBRE POUR LES BOUTONS DE CLASSE */
    .btn-class { 
      flex: 1; 
      padding: 12px; 
      border-radius: 14px; 
      border: 2px solid var(--border); 
      background: transparent; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all 0.2s; 
      text-align: center; 
      color: var(--text) !important;
    }
    .btn-class.active { 
      background: linear-gradient(135deg, var(--primary), var(--secondary)); 
      color: white !important; 
      border-color: transparent; 
    }
    
    /* Style pour les options de genre */
    .gender-group {
      display: flex;
      gap: 16px;
      margin-top: 8px;
    }
    .gender-card {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 2px solid var(--border);
      background: var(--card-bg);
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text);
    }
    .gender-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .gender-card.selected {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-color: transparent;
      color: white;
    }
    .gender-card.selected .gender-name {
      color: white;
    }
    .gender-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }
    .gender-name {
      font-size: 0.9rem;
      font-weight: 600;
    }
    
    .error-msg { background: rgba(231,76,60,0.1); color: #e74c3c; padding: 12px; border-radius: 12px; margin-bottom: 15px; display: none; font-size: 0.8rem; border-left: 3px solid #e74c3c; }
    .success-msg { background: rgba(46,204,113,0.1); color: #27ae60; padding: 12px; border-radius: 12px; margin-bottom: 15px; display: none; font-size: 0.8rem; border-left: 3px solid #27ae60; }
    .number-hint { font-size: 0.6rem; color: var(--text-light); margin-top: 6px; display: block; }
    .btn { padding: 14px 20px; border-radius: 40px; border: none; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.85rem; width: 100%; transition: all 0.2s ease; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
    .btn-primary:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="app-container">
    <div class="mobile-header">
      <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
      <div class="header-logo"><i class="fas fa-user-plus"></i><span>REGISTER</span></div>
      <div class="theme-btn-header" id="themeBtn"><i class="fas fa-palette"></i><span>Theme</span></div>
    </div>
    
    <div class="sheet-overlay" id="sheetOverlay"></div>
    <div class="bottom-sheet" id="bottomSheet">
      <div class="bottom-sheet-header"><h3><i class="fas fa-brush"></i> Theme</h3><button class="close-sheet" id="closeSheet"><i class="fas fa-times"></i></button></div>
      <div class="bottom-sheet-content">
        <div class="theme-grid-rect" id="themeGrid"></div>
        <div class="font-row-sheet"><div class="font-sheet" data-font="small">A<sup>-</sup></div><div class="font-sheet" data-font="medium">A</div><div class="font-sheet" data-font="large">A<sup>+</sup></div></div>
      </div>
    </div>
    
    <div class="sidebar-menu" id="sidebarMenu">
      <div class="sidebar-header"><h3><i class="fas fa-graduation-cap"></i> SMART-GRADE MENU</h3><button class="close-sidebar" id="closeSidebar"><i class="fas fa-times"></i></button></div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Home</a>
        <a href="login.html" class="nav-item"><i class="fas fa-sign-in-alt"></i> Login</a>
        <a href="register.html" class="nav-item active"><i class="fas fa-user-plus"></i> Register</a>
      </nav>
    </div>
    <div class="overlay" id="overlay"></div>
    
    <main class="main-content">
      <div class="glass-card text-center">
        <i class="fas fa-user-graduate" style="font-size:50px;color:var(--primary);"></i>
        <h2>Create Account</h2>
      </div>
      
      <div class="glass-card">
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        
        <div class="form-group">
          <label><i class="fas fa-user"></i> Full Name</label>
          <input type="text" id="userName" placeholder="Full name">
        </div>
        
        <div class="form-group">
          <label><i class="fas fa-school"></i> Class</label>
          <div class="flex-row">
            <button type="button" id="classB1" class="btn-class active">B1</button>
            <button type="button" id="classB2" class="btn-class">B2</button>
          </div>
          <input type="hidden" id="userClass" value="B1">
        </div>
        
        <div class="form-group">
          <label><i class="fas fa-venus-mars"></i> Profile Avatar</label>
          <div class="gender-group">
            <div class="gender-card selected" data-gender="boy" onclick="selectGender('boy')">
              <img src="./icons/avatar-boy.png" class="gender-avatar" alt="Boy">
              <span class="gender-name">Boy</span>
            </div>
            <div class="gender-card" data-gender="girl" onclick="selectGender('girl')">
              <img src="./icons/avatar-girl.png" class="gender-avatar" alt="Girl">
              <span class="gender-name">Girl</span>
            </div>
          </div>
          <input type="hidden" id="userGender" value="boy">
        </div>
        
        <div class="form-group">
          <label><i class="fas fa-hashtag"></i> Number</label>
          <input type="number" id="userNumber" placeholder="Number (1 to 70)" min="1" max="70">
          <small class="number-hint"><i class="fas fa-info-circle"></i> Number must be between 1 and 70</small>
        </div>
        
        <div class="form-group">
          <label><i class="fas fa-lock"></i> PIN (4 digits)</label>
          <input type="password" id="userPin" maxlength="4" placeholder="****" inputmode="numeric">
        </div>
        
        <div class="form-group">
          <label><i class="fas fa-check-circle"></i> Confirm PIN</label>
          <input type="password" id="confirmPin" maxlength="4" placeholder="****" inputmode="numeric">
        </div>
        
        <button class="btn btn-primary" onclick="handleRegister()"><i class="fas fa-user-plus"></i> Create Account</button>
        
        <div style="text-align:center;margin-top:16px;">
          <a href="login.html" style="color:var(--primary);font-size:0.8rem;">Already have an account?</a>
        </div>
      </div>
    </main>
  </div>
  
  <div id="toastContainer" class="toast-container"></div>
  
  <script src="js/utils.js"></script>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  
  <script>
    var selectedClass = 'B1';
    
    function selectGender(gender) {
      document.querySelectorAll('.gender-card').forEach(function(card) {
        card.classList.remove('selected');
      });
      document.querySelector('.gender-card[data-gender="' + gender + '"]').classList.add('selected');
      document.getElementById('userGender').value = gender;
    }
    
    document.getElementById('classB1').onclick = function() {
      selectedClass = 'B1';
      document.getElementById('classB1').classList.add('active');
      document.getElementById('classB2').classList.remove('active');
      document.getElementById('userClass').value = 'B1';
    };
    
    document.getElementById('classB2').onclick = function() {
      selectedClass = 'B2';
      document.getElementById('classB2').classList.add('active');
      document.getElementById('classB1').classList.remove('active');
      document.getElementById('userClass').value = 'B2';
    };
    
    function showError(msg) {
      var errorDiv = document.getElementById('errorMsg');
      errorDiv.innerHTML = '<i class="fas fa-circle-exclamation"></i> ' + msg;
      errorDiv.style.display = 'block';
      setTimeout(function() { errorDiv.style.display = 'none'; }, 4000);
    }
    
    function showSuccess(msg) {
      var successDiv = document.getElementById('successMsg');
      successDiv.innerHTML = '<i class="fas fa-check-circle"></i> ' + msg;
      successDiv.style.display = 'block';
      setTimeout(function() { successDiv.style.display = 'none'; }, 3000);
    }
    
    function handleRegister() {
      var name = document.getElementById('userName').value.trim();
      var number = parseInt(document.getElementById('userNumber').value);
      var pin = document.getElementById('userPin').value;
      var confirmPin = document.getElementById('confirmPin').value;
      var className = selectedClass;
      var gender = document.getElementById('userGender').value;
      
      if (!name) { showError('Please enter your full name'); return; }
      if (isNaN(number) || number < 1) { showError('Number must be at least 1'); return; }
      if (number > 70) { showError('Number cannot exceed 70 (maximum allowed)'); return; }
      
      var usedNumbers = getUsedNumbersInClass(className);
      if (usedNumbers.indexOf(number) !== -1) { showError('Number ' + number + ' is already taken in ' + className); return; }
      
      if (!pin || pin.length !== 4) { showError('PIN must be exactly 4 digits'); return; }
      if (!/^\d+$/.test(pin)) { showError('PIN must contain only numbers'); return; }
      if (pin !== confirmPin) { showError('PINs do not match'); return; }
      
      var result = createStudentAccount(name, number, className, pin, gender);
      
      if (result.success) {
        showSuccess('Account created successfully! Redirecting...');
        setTimeout(function() { window.location.href = 'login.html'; }, 1500);
      } else {
        showError(result.message);
      }
    }
    
    initMobileMenu();
    initThemeSelector();
    
    setTimeout(function() { if (typeof applyGlobalFont === 'function') applyGlobalFont(); }, 100);
  </script>
</body>
</html>
