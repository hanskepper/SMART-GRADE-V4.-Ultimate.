<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>SMART GRADE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Cinzel:wght@400;700&family=Quicksand:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Fredoka:wght@400;600;700&family=Pacifico&family=Bangers&family=Lobster&family=Permanent+Marker&family=Comfortaa:wght@300;400;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/night-mode.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f3b48">
  <style>
    /* ============================================ */
    /* SPLASH SCREEN - MÊME STYLE QUE L'APPLICATION */
    /* ============================================ */
    
    /* Cacher le header et le sidebar pour le splash */
    .mobile-header,
    .sidebar-menu,
    .sheet-overlay,
    .bottom-sheet {
      display: none !important;
    }
    
    .app-container {
      background: transparent !important;
    }
    
    /* Container du splash */
    .splash-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      height: 100%;
      width: 100%;
      padding: 20px;
      position: relative;
      z-index: 1;
    }
    
    /* Carte glassmorphism - identique aux autres pages */
    .splash-card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      animation: fadeInUp 0.6s ease;
    }
    
    /* Logo animé */
    .splash-logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 16px;
      display: block;
      animation: splashPulse 2s ease-in-out infinite;
      filter: drop-shadow(0 4px 15px rgba(0,255,255,0.2));
    }
    
    @keyframes splashPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }
    
    /* Titre avec dégradé */
    .splash-title {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, var(--secondary), var(--primary));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    
    /* Sous-titre */
    .splash-subtitle {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-light);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    
    /* Informations école - badges */
    .splash-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    
    .splash-info-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-light);
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    
    .splash-info-item i {
      color: var(--secondary);
      font-size: 0.7rem;
    }
    
    /* Barre de progression */
    .splash-progress {
      margin-top: 8px;
    }
    
    .splash-progress-bar {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    
    .splash-progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 4px;
      animation: progressAnim 6s ease-out forwards;
    }
    
    @keyframes progressAnim {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    
    .splash-progress-text {
      font-size: 0.6rem;
      color: var(--text-light);
      margin-top: 10px;
      font-family: 'Courier Prime', monospace;
    }
    
    /* Points animés */
    .splash-dots {
      display: inline-flex;
      gap: 3px;
      margin-left: 4px;
    }
    
    .splash-dots span {
      width: 4px;
      height: 4px;
      background: var(--secondary);
      border-radius: 50%;
      display: inline-block;
      animation: dotPulse 1.4s infinite ease-in-out both;
    }
    
    .splash-dots span:nth-child(1) { animation-delay: -0.32s; }
    .splash-dots span:nth-child(2) { animation-delay: -0.16s; }
    
    @keyframes dotPulse {
      0%, 80%, 100% {
        transform: scale(0.5);
        opacity: 0.3;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }
    
    /* Version badge */
    .splash-version {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 0.55rem;
      color: var(--text-light);
      background: var(--card-bg);
      padding: 5px 14px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      z-index: 2;
    }
    
    /* Animation fadeInUp */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Responsive */
    @media (max-width: 550px) {
      .splash-logo {
        width: 75px;
        height: 75px;
      }
      .splash-title {
        font-size: 1.5rem;
      }
      .splash-info-item {
        padding: 6px 12px;
        font-size: 0.6rem;
      }
      .splash-version {
        bottom: 15px;
        right: 15px;
        font-size: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="app-container">
    <div class="splash-container">
      <div class="glass-card splash-card">
        <!-- Logo -->
        <img src="icon.svg" alt="SMART GRADE" class="splash-logo">
        
        <!-- Titre -->
        <div class="splash-title">SMART GRADE</div>
        <div class="splash-subtitle">GRADE MANAGEMENT SYSTEM</div>
        
        <!-- Informations -->
        <div class="splash-info">
          <div class="splash-info-item">
            <i class="fas fa-school"></i>
            <span>GBHS FOUMBAN</span>
          </div>
          <div class="splash-info-item">
            <i class="fas fa-users"></i>
            <span>Form 4B Science</span>
          </div>
          <div class="splash-info-item">
            <i class="fas fa-calendar-alt"></i>
            <span>2025-2026</span>
          </div>
        </div>
        
        <!-- Progression -->
        <div class="splash-progress">
          <div class="splash-progress-bar">
            <div class="splash-progress-fill"></div>
          </div>
          <div class="splash-progress-text" id="progressText">
            Initializing system<span class="splash-dots"><span></span><span></span><span></span></span>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Version -->
    <div class="splash-version">
      <i class="fas fa-code-branch"></i> v4.0 Ultimate
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="js/utils.js"></script>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <!-- À ajouter dans le <head> -->
 <script src="js/auto-updater.js"></script>

  <script>
    // ============================================
    // THÈME ALÉATOIRE PARMI LES 20
    // ============================================
    var THEMES_LIST = [
      'default', 'crimson', 'forest', 'ocean', 'royal',
      'sunset', 'rose', 'turquoise', 'amber', 'graphite',
      'lavender', 'cherry', 'midnight', 'mint', 'coral',
      'indigo', 'chocolate', 'electric', 'steel', 'lime'
    ];

    var lastTheme = localStorage.getItem('smartgrade_splash_theme');
    var availableThemes = THEMES_LIST.filter(function(t) { return t !== lastTheme; });
    var randomIndex = Math.floor(Math.random() * availableThemes.length);
    var selectedTheme = availableThemes[randomIndex];
    
    document.body.classList.add('theme-' + selectedTheme);
    localStorage.setItem('smartgrade_splash_theme', selectedTheme);

    // ============================================
    // TEXTE PROGRESSIF
    // ============================================
    var progressMessages = [
      'Initializing system',
      'Loading modules',
      'Preparing workspace',
      'Almost ready',
      'Welcome to SMART GRADE'
    ];
    
    var msgIndex = 0;
    var progressText = document.getElementById('progressText');
    
    var msgInterval = setInterval(function() {
      if (msgIndex < progressMessages.length) {
        progressText.innerHTML = progressMessages[msgIndex] + '<span class="splash-dots"><span></span><span></span><span></span></span>';
        msgIndex++;
      } else {
        clearInterval(msgInterval);
      }
    }, 1300);

    // ============================================
    // REDIRECTION VERS INDEX
    // ============================================
    setTimeout(function() {
      document.body.style.transition = 'opacity 0.6s ease';
      document.body.style.opacity = '0';
      setTimeout(function() {
        window.location.href = 'index.html';
      }, 600);
    }, 7500);

    // ============================================
    // INITIALISATION DES PARTICULES
    // ============================================
    if (typeof initParticles === 'function') {
      initParticles();
    }
    
    // Cacher le toast container
    var toastContainer = document.getElementById('toastContainer');
    if (toastContainer) {
      toastContainer.style.display = 'none';
    }
  </script>
</body>
</html>
