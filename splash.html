<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SMART GRADE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    }
    
    .splash {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 0.5s ease;
    }
    
    .logo-wrapper {
      text-align: center;
      padding: 30px;
      border-radius: 40px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      animation: fadeInUp 0.8s ease-out;
    }
    
    .logo {
      width: 120px;
      height: 120px;
      display: block;
      margin: 0 auto;
      animation: logoPulse 2s ease-in-out infinite;
    }
    
    .title {
      margin-top: 20px;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, #00ffff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 1px;
      animation: titleGlow 2s ease-in-out infinite;
    }
    
    .subtitle {
      margin-top: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    
    .version {
      margin-top: 40px;
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 1px;
    }
    
    .progress-container {
      position: absolute;
      bottom: 50px;
      left: 10%;
      width: 80%;
    }
    
    .progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
      overflow: hidden;
    }
    
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00ffff, #ffffff);
      border-radius: 3px;
      animation: progressAnim 10s linear forwards;
    }
    
    .progress-text {
      text-align: center;
      margin-top: 10px;
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      font-family: monospace;
    }
    
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      pointer-events: none;
      animation: particleFall linear infinite;
    }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes logoPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255,255,255,0.3)); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 15px rgba(255,255,255,0.6)); }
    }
    
    @keyframes titleGlow {
      0%, 100% { text-shadow: 0 0 5px rgba(0,255,255,0.3); }
      50% { text-shadow: 0 0 15px rgba(0,255,255,0.6); }
    }
    
    @keyframes progressAnim {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    
    @keyframes particleFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.3; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="splash" id="splash">
    <div class="logo-wrapper">
      <img src="icon.svg" class="logo" alt="SMART GRADE">
      <div class="title">SMART GRADE</div>
      <div class="subtitle">Grade Management System</div>
    </div>
    <div class="version">Version 4.0 Ultimate</div>
    
    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div class="progress-text" id="progressPercent">Loading 0%</div>
    </div>
  </div>
  
  <script>
    // ============================================
    // THEMES COMPLETS (20 couleurs)
    // ============================================
    
    var THEMES = {
      default: { primary: '#0f3b48', secondary: '#00ffff', bgStart: '#0a1a2a', bgEnd: '#0f3b48' },
      crimson: { primary: '#c0392b', secondary: '#ff4757', bgStart: '#1a0a0a', bgEnd: '#c0392b' },
      forest: { primary: '#1e8449', secondary: '#2ecc71', bgStart: '#0a1a0a', bgEnd: '#1e8449' },
      ocean: { primary: '#006994', secondary: '#00b4d8', bgStart: '#0a121a', bgEnd: '#006994' },
      royal: { primary: '#6c3483', secondary: '#a569bd', bgStart: '#1a0a1a', bgEnd: '#6c3483' },
      sunset: { primary: '#d35400', secondary: '#f39c12', bgStart: '#1a0f0a', bgEnd: '#d35400' },
      rose: { primary: '#c44569', secondary: '#fd79a8', bgStart: '#1a0a15', bgEnd: '#c44569' },
      turquoise: { primary: '#00897b', secondary: '#1de9b6', bgStart: '#0a1a1a', bgEnd: '#00897b' },
      amber: { primary: '#b7950b', secondary: '#f1c40f', bgStart: '#1a1a0a', bgEnd: '#b7950b' },
      graphite: { primary: '#455a64', secondary: '#90a4ae', bgStart: '#121212', bgEnd: '#455a64' },
      lavender: { primary: '#7b1fa2', secondary: '#ce93d8', bgStart: '#1a0a1f', bgEnd: '#7b1fa2' },
      cherry: { primary: '#b71c1c', secondary: '#ef5350', bgStart: '#1a0a0a', bgEnd: '#b71c1c' },
      midnight: { primary: '#1a237e', secondary: '#5c6bc0', bgStart: '#0a0a1a', bgEnd: '#1a237e' },
      mint: { primary: '#00b894', secondary: '#55efc4', bgStart: '#0a1a0a', bgEnd: '#00b894' },
      coral: { primary: '#e74c3c', secondary: '#ff6b6b', bgStart: '#1a0f0a', bgEnd: '#e74c3c' },
      indigo: { primary: '#283593', secondary: '#7986cb', bgStart: '#0a0a1a', bgEnd: '#283593' },
      chocolate: { primary: '#5d4037', secondary: '#a1887f', bgStart: '#1a0f0a', bgEnd: '#5d4037' },
      electric: { primary: '#6a1b9a', secondary: '#e040fb', bgStart: '#1a0a1f', bgEnd: '#6a1b9a' },
      steel: { primary: '#37474f', secondary: '#78909c', bgStart: '#121517', bgEnd: '#37474f' },
      lime: { primary: '#558b2f', secondary: '#aed581', bgStart: '#1a1a0a', bgEnd: '#558b2f' }
    };
    
    // Liste des noms de thèmes
    var themeNames = ['default', 'crimson', 'forest', 'ocean', 'royal', 'sunset', 'rose', 'turquoise', 'amber', 'graphite', 'lavender', 'cherry', 'midnight', 'mint', 'coral', 'indigo', 'chocolate', 'electric', 'steel', 'lime'];
    
    // Choisir un thème aléatoire
    var randomThemeName = themeNames[Math.floor(Math.random() * themeNames.length)];
    var theme = THEMES[randomThemeName];
    
    // Appliquer le fond dégradé
    var splashDiv = document.getElementById('splash');
    splashDiv.style.background = 'linear-gradient(135deg, ' + theme.bgStart + ' 0%, ' + theme.primary + ' 50%, ' + theme.bgEnd + ' 100%)';
    
    // Adapter la couleur de la barre de progression
    var style = document.createElement('style');
    style.textContent = `
      .progress-fill {
        background: linear-gradient(90deg, ${theme.secondary}, ${theme.primary}) !important;
      }
      .title {
        background: linear-gradient(135deg, #ffffff, ${theme.secondary}) !important;
        -webkit-background-clip: text !important;
        background-clip: text !important;
      }
      .particle {
        background: ${theme.secondary} !important;
        box-shadow: 0 0 4px ${theme.secondary} !important;
      }
    `;
    document.head.appendChild(style);
    
    // Sauvegarder le thème pour l'application (optionnel)
    localStorage.setItem('smartgrade_splash_theme', randomThemeName);
    
    // Création des particules
    function createParticles() {
      for (var i = 0; i < 30; i++) {
        var particle = document.createElement('div');
        particle.className = 'particle';
        var size = Math.random() * 4 + 2;
        var left = Math.random() * 100;
        var delay = Math.random() * 10;
        var duration = Math.random() * 5 + 3;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = left + '%';
        particle.style.animationDelay = delay + 's';
        particle.style.animationDuration = duration + 's';
        particle.style.opacity = Math.random() * 0.5 + 0.2;
        document.body.appendChild(particle);
      }
    }
    
    // Mise à jour du pourcentage
    var startTime = Date.now();
    var duration = 10000;
    var percentEl = document.getElementById('progressPercent');
    
    var interval = setInterval(function() {
      var elapsed = Date.now() - startTime;
      var percent = Math.min(100, Math.floor((elapsed / duration) * 100));
      percentEl.textContent = 'Loading ' + percent + '%';
      if (elapsed >= duration) clearInterval(interval);
    }, 100);
    
    createParticles();
    
    // Redirection après 10 secondes
    setTimeout(function() {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.transition = 'opacity 0.5s ease';
        setTimeout(function() {
          window.location.href = 'index.html';
        }, 500);
      } else {
        window.location.href = 'index.html';
      }
    }, 10000);
  </script>
</body>
</html>
