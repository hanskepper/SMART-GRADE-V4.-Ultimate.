<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>SMART GRADE</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Cinzel:wght@400;700&family=Quicksand:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Fredoka:wght@400;600;700&family=Pacifico&family=Bangers&family=Lobster&family=Permanent+Marker&family=Comfortaa:wght@300;400;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/night-mode.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f3b48">
  <style>
    /* ============================================ */
    /* SPLASH SCREEN - AVEC NOUVEAU LOADER SVG */
    /* ============================================ */
    
    /* Cacher le header et le sidebar pour le splash */
    .mobile-header,
    .sidebar-menu,
    .sheet-overlay,
    .bottom-sheet {
      display: none !important;
    }
    
    .app-container {
      background: transparent !important;
    }
    
    /* Container du splash */
    .splash-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      height: 100%;
      width: 100%;
      padding: 20px;
      position: relative;
      z-index: 1;
    }
    
    /* Carte glassmorphism */
    .splash-card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      animation: fadeInUp 0.6s ease;
    }
    
    /* Logo animé */
    .splash-logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 16px;
      display: block;
      animation: splashPulse 2s ease-in-out infinite;
      filter: drop-shadow(0 4px 15px rgba(0,255,255,0.2));
    }
    
    @keyframes splashPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    /* Titre avec dégradé */
    .splash-title {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, var(--secondary), var(--primary));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    
    /* Sous-titre */
    .splash-subtitle {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-light);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    
    /* Informations école - badges */
    .splash-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    
    .splash-info-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-light);
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    
    .splash-info-item i {
      color: var(--secondary);
      font-size: 0.7rem;
    }
    
    /* ============================================ */
    /* NOUVEAU LOADER SVG (ton loader) */
    /* ============================================ */
    
    .loader-wrapper {
      margin: 20px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .container {
      --uib-size: 50px;
      --uib-color: var(--primary);
      --uib-speed: 1.4s;
      --uib-bg-opacity: 0.2;
      height: var(--uib-size);
      width: var(--uib-size);
      transform-origin: center;
      overflow: visible;
    }
    
    .car {
      fill: none;
      stroke: var(--uib-color);
      stroke-dasharray: 15, 85;
      stroke-dashoffset: 0;
      stroke-linecap: round;
      animation: travel var(--uib-speed) linear infinite;
      will-change: stroke-dasharray, stroke-dashoffset;
      transition: stroke 0.5s ease;
    }
    
    .track {
      stroke: var(--uib-color);
      opacity: var(--uib-bg-opacity);
      transition: stroke 0.5s ease;
    }
    
    @keyframes travel {
      0% {
        stroke-dashoffset: 0;
      }
      100% {
        stroke-dashoffset: -100;
      }
    }
    
    /* Texte de progression */
    .splash-progress-text {
      font-size: 0.6rem;
      color: var(--text-light);
      margin-top: 16px;
      font-family: 'Courier Prime', monospace;
      text-align: center;
    }
    
    /* Points animés */
    .splash-dots {
      display: inline-flex;
      gap: 3px;
      margin-left: 4px;
    }
    
    .splash-dots span {
      width: 4px;
      height: 4px;
      background: var(--secondary);
      border-radius: 50%;
      display: inline-block;
      animation: dotPulse 1.4s infinite ease-in-out both;
    }
    
    .splash-dots span:nth-child(1) { animation-delay: -0.32s; }
    .splash-dots span:nth-child(2) { animation-delay: -0.16s; }
    
    @keyframes dotPulse {
      0%, 80%, 100% {
        transform: scale(0.5);
        opacity: 0.3;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }
    
    /* Version badge */
    .splash-version {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 0.55rem;
      color: var(--text-light);
      background: var(--card-bg);
      padding: 5px 14px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      z-index: 2;
    }
    
    /* Animation fadeInUp */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Responsive */
    @media (max-width: 550px) {
      .splash-logo {
        width: 75px;
        height: 75px;
      }
      .splash-title {
        font-size: 1.5rem;
      }
      .splash-info-item {
        padding: 6px 12px;
        font-size: 0.6rem;
      }
      .splash-version {
        bottom: 15px;
        right: 15px;
        font-size: 0.5rem;
      }
      .container {
        --uib-size: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="app-container">
    <div class="splash-container">
      <div class="glass-card splash-card">
        <!-- Logo -->
        <img src="icon.svg" alt="SMART GRADE" class="splash-logo">
        
        <!-- Titre -->
        <div class="splash-title">SMART GRADE</div>
        <div class="splash-subtitle">GRADE MANAGEMENT SYSTEM</div>
        
        <!-- Informations -->
        <div class="splash-info">
          <div class="splash-info-item">
            <i class="fas fa-school"></i>
            <span>GBHS FOUMBAN</span>
          </div>
          <div class="splash-info-item">
            <i class="fas fa-users"></i>
            <span>Form 4B Science</span>
          </div>
          <div class="splash-info-item">
            <i class="fas fa-calendar-alt"></i>
            <span>2025-2026</span>
          </div>
        </div>
        
        <!-- NOUVEAU LOADER SVG -->
        <div class="loader-wrapper">
          <svg class="container" x="0px" y="0px" viewBox="0 0 40 40" height="40" width="40" preserveAspectRatio="xMidYMid meet">
            <path class="track" fill="none" stroke-width="4" pathLength="100" d="M29.760000000000005 18.72 c0 7.28 -3.9200000000000004 13.600000000000001 -9.840000000000002 16.96 c -2.8800000000000003 1.6800000000000002 -6.24 2.64 -9.840000000000002 2.64 c -3.6 0 -6.88 -0.96 -9.76 -2.64 c0 -7.28 3.9200000000000004 -13.52 9.840000000000002 -16.96 c2.8800000000000003 -1.6800000000000002 6.24 -2.64 9.76 -2.64 S26.880000000000003 17.040000000000003 29.760000000000005 18.72 c5.84 3.3600000000000003 9.76 9.68 9.840000000000002 16.96 c -2.8800000000000003 1.6800000000000002 -6.24 2.64 -9.76 2.64 c -3.6 0 -6.88 -0.96 -9.840000000000002 -2.64 c -5.84 -3.3600000000000003 -9.76 -9.68 -9.76 -16.96 c0 -7.28 3.9200000000000004 -13.600000000000001 9.76 -16.96 C25.84 5.120000000000001 29.760000000000005 11.440000000000001 29.760000000000005 18.72z"></path>
            <path class="car" fill="none" stroke-width="4" pathLength="100" d="M29.760000000000005 18.72 c0 7.28 -3.9200000000000004 13.600000000000001 -9.840000000000002 16.96 c -2.8800000000000003 1.6800000000000002 -6.24 2.64 -9.840000000000002 2.64 c -3.6 0 -6.88 -0.96 -9.76 -2.64 c0 -7.28 3.9200000000000004 -13.52 9.840000000000002 -16.96 c2.8800000000000003 -1.6800000000000002 6.24 -2.64 9.76 -2.64 S26.880000000000003 17.040000000000003 29.760000000000005 18.72 c5.84 3.3600000000000003 9.76 9.68 9.840000000000002 16.96 c -2.8800000000000003 1.6800000000000002 -6.24 2.64 -9.76 2.64 c -3.6 0 -6.88 -0.96 -9.840000000000002 -2.64 c -5.84 -3.3600000000000003 -9.76 -9.68 -9.76 -16.96 c0 -7.28 3.9200000000000004 -13.600000000000001 9.76 -16.96 C25.84 5.120000000000001 29.760000000000005 11.440000000000001 29.760000000000005 18.72z"></path>
          </svg>
        </div>
        
        <!-- Texte de progression -->
        <div class="splash-progress-text" id="progressText">
          Initializing system<span class="splash-dots"><span></span><span></span><span></span></span>
        </div>
      </div>
    </div>
    
    <!-- Version -->
    <div class="splash-version">
      <i class="fas fa-code-branch"></i> v4.0 Ultimate
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="js/utils.js"></script>
  <script src="js/database.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <script>
    // ============================================
    // THÈME ALÉATOIRE PARMI LES 20
    // ============================================
    var THEMES_LIST = [
      'default', 'crimson', 'forest', 'ocean', 'royal',
      'sunset', 'rose', 'turquoise', 'amber', 'graphite',
      'lavender', 'cherry', 'midnight', 'mint', 'coral',
      'indigo', 'chocolate', 'electric', 'steel', 'lime'
    ];

    var lastTheme = localStorage.getItem('smartgrade_splash_theme');
    var availableThemes = THEMES_LIST.filter(function(t) { return t !== lastTheme; });
    var randomIndex = Math.floor(Math.random() * availableThemes.length);
    var selectedTheme = availableThemes[randomIndex];
    
    document.body.classList.add('theme-' + selectedTheme);
    localStorage.setItem('smartgrade_splash_theme', selectedTheme);

    // ============================================
    // TEXTE PROGRESSIF (10 secondes)
    // ============================================
    var progressMessages = [
      'Initializing system',
      'Loading modules',
      'Preparing workspace',
      'Connecting to database',
      'Loading themes',
      'Loading fonts',
      'Checking updates',
      'Almost ready',
      'Finalizing',
      'Welcome to SMART GRADE'
    ];
    
    var msgIndex = 0;
    var progressText = document.getElementById('progressText');
    var totalDuration = 10000; // 10 secondes
    var intervalTime = totalDuration / progressMessages.length; // ~1000ms par message
    
    var msgInterval = setInterval(function() {
      if (msgIndex < progressMessages.length) {
        progressText.innerHTML = progressMessages[msgIndex] + '<span class="splash-dots"><span></span><span></span><span></span></span>';
        msgIndex++;
      } else {
        clearInterval(msgInterval);
      }
    }, intervalTime);

    // ============================================
    // REDIRECTION VERS INDEX APRÈS 10 SECONDES
    // ============================================
    setTimeout(function() {
      document.body.style.transition = 'opacity 0.6s ease';
      document.body.style.opacity = '0';
      setTimeout(function() {
        window.location.href = 'index.html';
      }, 600);
    }, totalDuration + 500);

    // ============================================
    // INITIALISATION DES PARTICULES
    // ============================================
    if (typeof initParticles === 'function') {
      initParticles();
    }
    
    // Cacher le toast container
    var toastContainer = document.getElementById('toastContainer');
    if (toastContainer) {
      toastContainer.style.display = 'none';
    }
    
    // ============================================
    // APPLIQUER LA COULEUR DU THÈME AU LOADER
    // ============================================
    function updateLoaderColor() {
      var rootStyles = getComputedStyle(document.body);
      var primaryColor = rootStyles.getPropertyValue('--primary').trim();
      var loaders = document.querySelectorAll('.container');
      for (var i = 0; i < loaders.length; i++) {
        loaders[i].style.setProperty('--uib-color', primaryColor);
      }
    }
    
    setTimeout(updateLoaderColor, 100);
    
    // Observer les changements de thème
    var themeObserver = new MutationObserver(function() {
      updateLoaderColor();
    });
    themeObserver.observe(document.body, { attributes: true, attributeFilter: ['class'] });
  </script>
</body>
</html>
