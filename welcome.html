<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SMART GRADE - Welcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Cinzel:wght@400;700&family=Quicksand:wght@400;600;700&family=Courier+Prime:wght@400;700&family=Fredoka:wght@400;600;700&family=Pacifico&family=Bangers&family=Lobster&family=Permanent+Marker&family=Comfortaa:wght@300;400;700&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/night-mode.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f3b48">
  <style>
    @keyframes floatUp {
      0% { transform: translateY(60px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes slideRight {
      0% { transform: translateX(-80px); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideLeft {
      0% { transform: translateX(80px); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideUp {
      0% { transform: translateY(50px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeInScale {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(0,255,255,0.2); }
      50% { box-shadow: 0 0 25px rgba(0,255,255,0.5); }
    }
    @keyframes iconBounce {
      0%, 100% { transform: translateY(0); }
      30% { transform: translateY(-10px); }
      50% { transform: translateY(0); }
      70% { transform: translateY(-5px); }
    }
    @keyframes ripple {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(4); opacity: 0; }
    }
    @keyframes sparkle {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-80px) scale(0); opacity: 0; }
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes numberCount {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes confettiFall {
      0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    @keyframes stripeMove {
      0% { background-position: 0 0; }
      100% { background-position: 40px 0; }
    }
    @keyframes buttonReveal {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    /* Animation d'entrée de 5 secondes */
    .welcome-container {
      animation: fadeInScale 0.8s ease-out;
    }
    
    .welcome-buttons {
      opacity: 0;
      animation: buttonReveal 0.6s ease forwards;
      animation-delay: 0.5s;
    }
    
    .welcome-hero {
      text-align: center;
      padding: 35px 24px 30px;
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      animation: floatUp 0.8s ease forwards;
    }
    .welcome-hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.05) 10px, rgba(255,255,255,0.05) 20px);
      animation: stripeMove 3s linear infinite;
      z-index: 0;
    }
    .welcome-hero::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.1), transparent 70%);
      z-index: 0;
    }
    .welcome-hero > * { position: relative; z-index: 1; }
    
    .welcome-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.5);
      animation: glowPulse 3s ease infinite, iconBounce 3s ease infinite;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .welcome-avatar .ripple-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.4);
      animation: ripple 2s ease-out infinite;
    }
    .welcome-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .welcome-avatar i {
      font-size: 48px;
      color: white;
    }
    
    .welcome-name {
      font-size: 1.6rem;
      font-weight: 800;
      color: white;
      margin-bottom: 8px;
      text-shadow: 0 3px 12px rgba(0,0,0,0.2);
      animation: popIn 0.6s ease forwards;
    }
    .welcome-class {
      font-size: 0.9rem;
      opacity: 0.9;
      color: white;
      font-weight: 500;
      margin-bottom: 12px;
      animation: floatUp 0.8s ease forwards;
      animation-delay: 0.1s;
      opacity: 0;
      animation-fill-mode: forwards;
    }
    .welcome-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.7rem;
      backdrop-filter: blur(10px);
      animation: floatUp 0.8s ease forwards;
      animation-delay: 0.2s;
      opacity: 0;
      animation-fill-mode: forwards;
    }
    
    .stats-grid-welcome {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card-welcome {
      text-align: center;
      padding: 20px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      animation: slideUp 0.6s ease forwards;
      opacity: 0;
      animation-fill-mode: forwards;
    }
    .stat-card-welcome:nth-child(1) { animation-delay: 0.3s; }
    .stat-card-welcome:nth-child(2) { animation-delay: 0.4s; }
    .stat-card-welcome:nth-child(3) { animation-delay: 0.5s; }
    .stat-card-welcome:nth-child(4) { animation-delay: 0.6s; }
    
    .stat-card-welcome:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      border-color: var(--primary);
    }
    .stat-card-welcome .stat-icon {
      font-size: 2rem;
      margin-bottom: 8px;
      color: var(--primary);
    }
    .stat-card-welcome .stat-number {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .stat-card-welcome .stat-text {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 6px;
      opacity: 0.7;
    }
    
    .quote-card-welcome {
      text-align: center;
      padding: 24px 20px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      margin-bottom: 20px;
      animation: slideUp 0.6s ease forwards;
      animation-delay: 0.7s;
      opacity: 0;
      animation-fill-mode: forwards;
    }
    .quote-card-welcome .quote-text {
      font-style: italic;
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .quote-card-welcome .quote-author {
      font-size: 0.7rem;
      opacity: 0.5;
      font-weight: 600;
    }
    
    .welcome-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .welcome-buttons .btn {
      animation: slideUp 0.6s ease forwards;
      opacity: 0;
    }
    .welcome-buttons .btn:first-child { animation-delay: 0.8s; }
    .welcome-buttons .btn:last-child { animation-delay: 0.9s; }
    
    /* Confettis */
    .confetti-piece {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      z-index: 9999;
      pointer-events: none;
      animation: confettiFall 3s ease-in forwards;
    }
    
    .sparkle-dot {
      position: fixed;
      width: 5px;
      height: 5px;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      animation: sparkle 0.8s ease forwards;
      z-index: 9999;
    }
    
    /* Loader d'attente avant l'apparition des boutons */
    .welcome-loader {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 20px 0;
      animation: fadeInScale 0.4s ease;
    }
    .loader-dot {
      width: 10px;
      height: 10px;
      background: var(--primary);
      border-radius: 50%;
      animation: loaderBounce 1.4s ease-in-out infinite;
    }
    .loader-dot:nth-child(1) { animation-delay: 0s; }
    .loader-dot:nth-child(2) { animation-delay: 0.2s; }
    .loader-dot:nth-child(3) { animation-delay: 0.4s; }
    
    @keyframes loaderBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40% { transform: scale(1.2); opacity: 1; }
    }
    
    @media (min-width: 600px) {
      .stats-grid-welcome { grid-template-columns: repeat(4, 1fr); }
      .welcome-buttons { flex-direction: row; }
      .welcome-name { font-size: 2rem; }
    }
  </style>
</head>

  <script>
    // ============================================
    // APPLICATION DES POLICES GLOBALES
    // ============================================
    function applyGlobalFontToWelcome() {
      var savedFont = localStorage.getItem('smartgrade_font_family') || 'inter';
      var fontMap = {
        'inter': 'Inter, sans-serif', 'roboto': 'Roboto, sans-serif', 'cinzel': 'Cinzel, serif',
        'quicksand': 'Quicksand, sans-serif', 'courier-prime': '"Courier Prime", monospace',
        'fredoka': 'Fredoka, sans-serif', 'pacifico': 'Pacifico, cursive', 'bangers': 'Bangers, cursive',
        'lobster': 'Lobster, cursive', 'permanent-marker': '"Permanent Marker", cursive',
        'comfortaa': 'Comfortaa, sans-serif', 'righteous': 'Righteous, sans-serif'
      };
      var fontFamily = fontMap[savedFont] || 'Inter, sans-serif';
      document.body.style.fontFamily = fontFamily;
      
      var allElements = document.querySelectorAll('body, body *');
      for (var i = 0; i < allElements.length; i++) {
        if (allElements[i].style) {
          allElements[i].style.fontFamily = fontFamily;
        }
      }
    }
    
    var cu = null;
    var profile = null;
    
    // Animation des nombres
    function animateNumber(element, final) {
      var current = 0;
      var step = final / 30;
      var timer = setInterval(function() {
        current += step;
        if (current >= final) {
          element.textContent = final.toFixed(2);
          clearInterval(timer);
        } else {
          element.textContent = current.toFixed(2);
        }
      }, 20);
    }
    
    // Lancer les confettis
    function launchConfetti() {
      var colors = ['#3498db', '#2ecc71', '#e74c3c', '#f39c12', '#9b59b6', '#1abc9c', '#e67e22', '#00bcd4', '#ff6b6b', '#ffd93d'];
      for (var i = 0; i < 80; i++) {
        var piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.top = '-20px';
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = Math.random() * 1 + 's';
        piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
        piece.style.width = (Math.random() * 6 + 4) + 'px';
        piece.style.height = (Math.random() * 6 + 4) + 'px';
        document.body.appendChild(piece);
        setTimeout(function(p) { if(p && p.parentNode) p.parentNode.removeChild(p); }, 4000);
      }
    }
    
    // Effet sparkle au clic
    function createSparkle(e) {
      var rect = this.getBoundingClientRect();
      var centerX = rect.left + rect.width / 2;
      var centerY = rect.top + rect.height / 2;
      var sparkColors = ['#fff', '#ffd93d', '#ff6b6b', '#00ffff', '#ff69b4'];
      for (var i = 0; i < 25; i++) {
        var dot = document.createElement('div');
        dot.className = 'sparkle-dot';
        var angle = Math.random() * Math.PI * 2;
        var radius = Math.random() * 70;
        dot.style.left = (centerX + Math.cos(angle) * radius - 3) + 'px';
        dot.style.top = (centerY + Math.sin(angle) * radius - 3) + 'px';
        dot.style.backgroundColor = sparkColors[Math.floor(Math.random() * sparkColors.length)];
        dot.style.width = (Math.random() * 6 + 2) + 'px';
        dot.style.height = dot.style.width;
        dot.style.animationDuration = (Math.random() * 0.5 + 0.6) + 's';
        document.body.appendChild(dot);
        setTimeout(function(d) { if(d && d.parentNode) d.parentNode.removeChild(d); }, 800);
      }
    }
    
    function initWelcome() {
      cu = JSON.parse(localStorage.getItem('smartgrade_current') || 'null');
      if (!cu) { 
        window.location.href = 'login.html';
        return;
      }
      
      profile = getProfile(cu.id);
      
      // Avatar
      var avatarContainer = document.getElementById('welcomeAvatar');
      if (profile.avatarBase64 && profile.avatarBase64 !== '') {
        avatarContainer.innerHTML = '<div class="ripple-ring"></div><img src="' + profile.avatarBase64 + '" alt="Avatar">';
      } else {
        avatarContainer.innerHTML = '<div class="ripple-ring"></div><i class="fas fa-user-graduate"></i>';
      }
      
      document.getElementById('welcomeName').textContent = 'Welcome, ' + cu.name + '!';
      document.getElementById('welcomeInfo').innerHTML = '<i class="fas fa-school"></i> ' + cu.class + ' - #' + cu.number;
      
      var grades = JSON.parse(localStorage.getItem('smartgrade_grades_' + cu.id) || '[]');
      var ach = JSON.parse(localStorage.getItem('smartgrade_achievements_' + cu.id) || '[]');
      var streak = JSON.parse(localStorage.getItem('smartgrade_streak_' + cu.id) || '{"days":0}');
      
      var t1 = calculateStudentTermAverage ? calculateStudentTermAverage(cu.id, 1) : 0;
      var t2 = calculateStudentTermAverage ? calculateStudentTermAverage(cu.id, 2) : 0;
      var t3 = calculateStudentTermAverage ? calculateStudentTermAverage(cu.id, 3) : 0;
      var overall = Math.round(((t1 + t2 + t3) / 3) * 100) / 100;
      
      // Citations
      var quotes = [
        { q: "Success is not final, failure is not fatal. It is the courage to continue that counts.", a: "Winston Churchill" },
        { q: "The future belongs to those who believe in the beauty of their dreams.", a: "Eleanor Roosevelt" },
        { q: "Education is the passport to the future, for tomorrow belongs to those who prepare for it today.", a: "Malcolm X" },
        { q: "It does not matter how slowly you go as long as you do not stop.", a: "Confucius" },
        { q: "The expert in anything was once a beginner.", a: "Helen Hayes" },
        { q: "Education is not the filling of a pail, but the lighting of a fire.", a: "W.B. Yeats" },
        { q: "Believe you can and you're halfway there.", a: "Theodore Roosevelt" }
      ];
      var randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
      document.getElementById('wQuote').textContent = '"' + randomQuote.q + '"';
      document.getElementById('wAuthor').textContent = '- ' + randomQuote.a;
      
      // Timer de 5 secondes avant d'afficher le contenu
      var loader = document.getElementById('welcomeLoader');
      var statsGrid = document.getElementById('statsGrid');
      var quoteCard = document.getElementById('quoteCard');
      var buttons = document.getElementById('welcomeButtons');
      
      setTimeout(function() {
        loader.style.display = 'none';
        statsGrid.style.display = 'grid';
        quoteCard.style.display = 'block';
        buttons.style.display = 'flex';
        
        // Remplir les valeurs
        document.getElementById('wOverall').textContent = overall.toFixed(2);
        document.getElementById('wGrades').textContent = grades.length;
        var unlockedCount = 0;
        for (var i = 0; i < ach.length; i++) if (ach[i].unlocked) unlockedCount++;
        document.getElementById('wBadges').textContent = unlockedCount;
        document.getElementById('wStreak').textContent = streak.days || 0;
        
        // Animation des nombres
        setTimeout(function() {
          animateNumber(document.getElementById('wOverall'), overall);
        }, 100);
        
        // Lancer les confettis
        launchConfetti();
        
        // Appliquer la police
        applyGlobalFontToWelcome();
        
      }, 2500); // 2.5 secondes d'attente avant l'affichage
      
      // Header avatar
      var headerAvatar = document.getElementById('headerAvatar');
      if (profile.avatarBase64 && profile.avatarBase64 !== '') {
        headerAvatar.innerHTML = '<img src="' + profile.avatarBase64 + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
      }
      
      // Effet sparkle au clic sur l'avatar
      document.getElementById('welcomeAvatar').addEventListener('click', createSparkle);
      
      initThemeSelector();
      initMobileMenu();
      
      // Notifications
      requestNotificationPermission();
      if (typeof checkStreakMilestone === 'function') checkStreakMilestone(cu.id);
      if (typeof checkAndNotifyAchievements === 'function') checkAndNotifyAchievements(cu.id);
      
      // Observer les changements de thème/police
      var observer = new MutationObserver(function() {
        applyGlobalFontToWelcome();
      });
      observer.observe(document.body, { attributes: true, attributeFilter: ['class', 'style'] });
      
      window.addEventListener('storage', function(e) {
        if (e.key === 'smartgrade_font_family') {
          applyGlobalFontToWelcome();
        }
      });
    }
    
    initWelcome();
  </script>
</body>
</html>
